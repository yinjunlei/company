/* ----------------------------------------------------------------
 * 5.9 一键导入（超级管理员专属）
 *     零依赖解析 Excel(.xlsx) / CSV → 批量建立部门人员账号
 * ---------------------------------------------------------------- */

/* ---------- 下载 / 编码工具 ---------- */
function csvEscape(v){
  const s = String(v === null || v === undefined ? '' : v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(headers, rows){
  return '\ufeff' + [headers.map(csvEscape).join(',')]
    .concat(rows.map(r => r.map(csvEscape).join(','))).join('\r\n');
}
function downloadText(filename, text, mime){
  const blob = new Blob([text], { type: (mime || 'text/csv') + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => { try{ URL.revokeObjectURL(a.href); }catch(_){} }, 3000);
}

/* ---------- 5.9.1 ZIP 读取（xlsx 本质是 zip 包） ---------- */
function u16le(b, o){ return (b[o] | (b[o+1] << 8)) >>> 0; }
function u32le(b, o){ return (b[o] | (b[o+1] << 8) | (b[o+2] << 16) | (b[o+3] << 24)) >>> 0; }

/** 解析 ZIP 中央目录，返回 { 条目名: { method, raw } } */
function unzipEntries(buf){
  let eocd = -1;
  const limit = Math.max(0, buf.length - 22 - 65535);
  for(let i = buf.length - 22; i >= limit; i--){
    if(u32le(buf, i) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('文件不是有效的 .xlsx（未找到 ZIP 结构），请确认未加密且未损坏');

  const total = u16le(buf, eocd + 10);
  let off = u32le(buf, eocd + 16);
  const out = {};
  for(let n = 0; n < total; n++){
    if(off + 46 > buf.length || u32le(buf, off) !== 0x02014b50) break;
    const method   = u16le(buf, off + 10);
    const compSize = u32le(buf, off + 20);
    const nameLen  = u16le(buf, off + 28);
    const extraLen = u16le(buf, off + 30);
    const cmtLen   = u16le(buf, off + 32);
    const localOff = u32le(buf, off + 42);
    const name = new TextDecoder('utf-8').decode(buf.subarray(off + 46, off + 46 + nameLen));
    if(u32le(buf, localOff) === 0x04034b50){
      const lNameLen  = u16le(buf, localOff + 26);
      const lExtraLen = u16le(buf, localOff + 28);
      const start = localOff + 30 + lNameLen + lExtraLen;
      out[name] = { method, raw: buf.subarray(start, start + compSize) };
    }
    off += 46 + nameLen + extraLen + cmtLen;
  }
  return out;
}

/** raw deflate 解压（浏览器原生 DecompressionStream，无需第三方库） */
async function inflateRaw(bytes){
  if(typeof DecompressionStream === 'undefined'){
    throw new Error('当前浏览器不支持解压 .xlsx，请在 Excel / WPS 中「另存为 CSV」后再导入，或改用新版 Chrome / Edge / Firefox / Safari');
  }
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/* ---------- 5.9.2 XML 工具 ---------- */
function xmlTags(node, tag){
  if(!node) return [];
  let list = node.getElementsByTagName(tag);
  if(list && list.length) return Array.prototype.slice.call(list);
  list = node.getElementsByTagNameNS('*', tag);
  return list ? Array.prototype.slice.call(list) : [];
}
/** 单元格引用 → 列序号，如 C5 → 2 */
function colIdx(ref){
  const m = /^([A-Z]+)/.exec(String(ref || ''));
  if(!m) return -1;
  let n = 0;
  for(let i = 0; i < m[1].length; i++) n = n * 26 + (m[1].charCodeAt(i) - 64);
  return n - 1;
}

/* ---------- 5.9.3 读取 xlsx → [{name, rows}] ---------- */
async function readXlsxSheets(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  const entries = unzipEntries(buf);
  const readText = async name => {
    const e = entries[name];
    if(!e) return null;
    if(e.method === 0) return new TextDecoder('utf-8').decode(e.raw);
    if(e.method === 8) return new TextDecoder('utf-8').decode(await inflateRaw(e.raw));
    throw new Error('不支持的压缩方式（' + e.method + '）');
  };
  const parser = new DOMParser();

  /* 共享字符串表 */
  let shared = [];
  const ssXml = await readText('xl/sharedStrings.xml');
  if(ssXml){
    const doc = parser.parseFromString(ssXml, 'application/xml');
    shared = xmlTags(doc, 'si').map(si => xmlTags(si, 't').map(t => t.textContent).join(''));
  }

  /* 工作表清单：名称 + 内部路径 */
  let list = [];
  const wbXml  = await readText('xl/workbook.xml');
  const relXml = await readText('xl/_rels/workbook.xml.rels');
  if(wbXml && relXml){
    const wb   = parser.parseFromString(wbXml, 'application/xml');
    const rels = parser.parseFromString(relXml, 'application/xml');
    const rel  = {};
    xmlTags(rels, 'Relationship').forEach(r => { rel[r.getAttribute('Id')] = r.getAttribute('Target'); });
    xmlTags(wb, 'sheet').forEach((s, i) => {
      const rid = s.getAttribute('r:id')
        || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id')
        || ('rId' + (i + 1));
      let t = String(rel[rid] || ('worksheets/sheet' + (i + 1) + '.xml')).replace(/^\/+/, '');
      if(t.indexOf('xl/') !== 0) t = 'xl/' + t;
      list.push({ name: s.getAttribute('name') || ('工作表' + (i + 1)), path: t });
    });
  }
  if(!list.length){
    list = Object.keys(entries)
      .filter(k => /^xl\/worksheets\/sheet[^/]*\.xml$/.test(k))
      .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
      .map((p, i) => ({ name: '工作表' + (i + 1), path: p }));
  }

  /* 逐个工作表解析单元格 */
  const sheets = [];
  for(const item of list){
    const xml = await readText(item.path);
    if(!xml) continue;
    const doc = parser.parseFromString(xml, 'application/xml');
    const tmp = [];
    xmlTags(doc, 'row').forEach(rEl => {
      const rNum = Number(rEl.getAttribute('r') || (tmp.length + 1));
      const arr = [];
      xmlTags(rEl, 'c').forEach(cEl => {
        const i = colIdx(cEl.getAttribute('r'));
        const t = cEl.getAttribute('t') || '';
        let val = '';
        if(t === 'inlineStr'){
          val = xmlTags(cEl, 't').map(x => x.textContent).join('');
        }else{
          const vEl = xmlTags(cEl, 'v')[0];
          const raw = vEl ? vEl.textContent : '';
          if(t === 's'){
            const k = Number(raw);
            val = (shared[k] !== undefined) ? shared[k] : '';
          }else if(t === 'b'){
            val = raw === '1' ? '是' : '否';
          }else{
            val = raw;
          }
        }
        arr[i < 0 ? arr.length : i] = String(val === null || val === undefined ? '' : val).trim();
      });
      tmp[rNum - 1] = arr;
    });
    const rows = [];
    for(let i = 0; i < tmp.length; i++) rows.push(tmp[i] || []);
    sheets.push({ name: item.name, rows: rows });
  }
  if(!sheets.length) throw new Error('未能解析出任何工作表，请确认文件内容');
  return sheets;
}

/* ---------- 5.9.4 读取 CSV → [{name, rows}] ---------- */
function readCsvSheets(text){
  let t = String(text).replace(/^\ufeff/, '');
  /* 分隔符自动识别：制表符 / 逗号 / 分号 / 中文逗号 */
  const head = t.split(/\r?\n/).find(l => l.trim()) || '';
  const cand = [
    ['\t', (head.match(/\t/g) || []).length],
    [',',  (head.match(/,/g)  || []).length],
    [';',  (head.match(/;/g)  || []).length],
    ['，', (head.match(/，/g)  || []).length]
  ].sort((a, b) => b[1] - a[1]);
  const delim = cand[0][1] > 0 ? cand[0][0] : ',';

  const rows = [];
  let row = [], cur = '', inQ = false;
  for(let i = 0; i < t.length; i++){
    const ch = t[i];
    if(inQ){
      if(ch === '"'){
        if(t[i + 1] === '"'){ cur += '"'; i++; } else inQ = false;
      }else cur += ch;
    }else if(ch === '"'){ inQ = true; }
    else if(ch === delim){ row.push(cur); cur = ''; }
    else if(ch === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
    else if(ch === '\r'){ /* 忽略 */ }
    else cur += ch;
  }
  if(cur !== '' || row.length){ row.push(cur); rows.push(row); }
  const clean = rows
    .map(r => r.map(c => String(c).trim()))
    .filter(r => r.some(c => c !== ''));
  return [{ name: 'CSV 数据', rows: clean }];
}

/* ---------- 5.9.5 表头识别与取值归一 ---------- */
const IMPORT_FIELDS = [
  { key:'org',      label:'机构', aliases:['机构','机构名称','机构分类','一级机构','所属机构','组织分类','单位'] },
  { key:'dept',     label:'部门', aliases:['部门','部门名称','所属部门','二级部门','部门组织','中心'] },
  { key:'name',     label:'姓名', aliases:['姓名','名字','人员姓名','学生姓名','成员姓名'] },
  { key:'username', label:'账号', aliases:['账号','用户名','登录账号','登录名','学号','工号','账号名'] },
  { key:'password', label:'密码', aliases:['密码','登录密码','初始密码','账号密码','口令'] },
  { key:'rank',     label:'职级', aliases:['职级','级别','层级','干部层级','职务级别'] },
  { key:'title',    label:'岗位', aliases:['岗位','职位','岗位名称','职务','岗位职务','担任职务'] },
  { key:'phone',    label:'电话', aliases:['电话','手机','手机号','联系电话','联系方式','电话号码','手机号码'] },
  { key:'status',   label:'状态', aliases:['状态','账号状态','是否启用','启用状态'] }
];

/** 表头归一化：全角转半角、去空格与标点、转小写 */
function normHeader(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/[\uff01-\uff5e]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
    .replace(/[\s\u3000]/g, '')
    .replace(/[（）()【】\[\]：:*＊/、,，.。·\-—]/g, '')
    .toLowerCase();
}
/** 表头行 → 字段映射 { 字段key: 列序号 } */
function mapHeaders(headerRow){
  const map = {};
  const norm = (headerRow || []).map(normHeader);
  IMPORT_FIELDS.forEach(f => {
    const cands = [f.label].concat(f.aliases).map(normHeader);
    for(let i = 0; i < norm.length; i++){
      if(norm[i] && cands.indexOf(norm[i]) >= 0){ map[f.key] = i; break; }
    }
  });
  return map;
}
/** 职级归一：优先读「职级」列，其次从「岗位」文字推断 */
function normRank(rankText, titleText){
  const r = String(rankText || '').trim();
  const t = String(titleText || '').trim();
  if(/正职|chief/i.test(r))   return 'chief';
  if(/副职|deputy/i.test(r))  return 'deputy';
  if(/干事|队员|member|部员|工作人员|成员/i.test(r)) return 'member';
  const s = r + ' ' + t;
  if(!s.trim()) return 'member';
  if(/副/.test(s)) return 'deputy';
  if(/(部长|主任|团长|队长|主席|书记|会长|社长|站长|负责人)/.test(s)) return 'chief';
  return 'member';
}
/** 状态归一 */
function normStatus(v){
  const s = String(v === null || v === undefined ? '' : v).trim();
  if(!s) return 1;
  if(/^(0|false|no|n)$/i.test(s)) return 0;
  if(/禁用|停用|失效|离职|关闭|冻结|否/.test(s)) return 0;
  return 1;
}

/* ---------- 5.9.6 逐行分析（表头定位 + 校验） ---------- */
function analyzeSheet(sheets, sheetIdx, opts){
  const sheet = sheets[sheetIdx];
  if(!sheet) throw new Error('未选择工作表');

  /* 去掉完全空行，同时保留原始行号 */
  const lines = [];
  sheet.rows.forEach((r, i) => {
    if(r && r.some(c => String(c || '').trim() !== '')) lines.push({ cells: r, rowNo: i + 1 });
  });
  if(!lines.length) throw new Error('该工作表没有可用数据行');

  /* 表头行：前 6 行里字段命中最多的那一行 */
  let headRow = 0, headMap = {}, best = -1;
  for(let i = 0; i < Math.min(lines.length, 6); i++){
    const m = mapHeaders(lines[i].cells);
    const score = ['name', 'username', 'dept', 'phone', 'password', 'rank', 'title'].filter(k => m[k] !== undefined).length;
    if(score > best){ best = score; headRow = i; headMap = m; }
  }
  if(best < 2){
    throw new Error('未能识别表头。请确认表格第一行包含「姓名、账号、部门」等列名，可先下载导入模板参考格式。');
  }

  const cols = {};
  IMPORT_FIELDS.forEach(f => { cols[f.key] = headMap[f.key]; });

  const existingByName = {};
  DB.users.forEach(u => { existingByName[u.username] = u; });
  const seenInFile = {};

  const items = [];
  for(let i = headRow + 1; i < lines.length; i++){
    const { cells, rowNo } = lines[i];
    const val = k => (cols[k] === undefined ? '' : String(cells[cols[k]] === undefined ? '' : cells[cols[k]]).trim());

    const it = {
      rowNo,
      org: val('org'), deptName: val('dept'), name: val('name'),
      username: val('username'), password: val('password'),
      title: val('title'), phone: val('phone'),
      status: opts.enableAll ? 1 : normStatus(val('status')),
      deptId: '', act: 'new', msg: ''
    };
    it.rank = normRank(val('rank'), it.title);

    /* 跳过小计行 / 说明行 */
    if(/^(合计|小计|总计|备注|说明|注)$/.test(it.name)) continue;
    if(!it.name && !it.username && !it.deptName) continue;

    const errs = [];
    if(!it.name)     errs.push('缺少姓名');
    if(!it.username) errs.push('缺少账号');
    if(!it.deptName) errs.push('缺少部门');

    /* 部门定位 */
    const dept = DB.departments.find(d => d.name === it.deptName);
    if(dept){
      it.deptId = dept.id;
    }else if(!opts.autoCreate){
      errs.push('部门不存在：' + it.deptName);
    }else if(!it.org){
      errs.push('部门「' + it.deptName + '」不存在，且「机构」列为空，无法自动创建');
    }

    /* 机构校验（部门为新建时才需要） */
    if(!it.deptId && it.org && !DB.organizations.some(o => o.name === it.org) && !opts.autoCreate){
      errs.push('机构不存在：' + it.org);
    }

    /* 账号重复 */
    const exist = existingByName[it.username];
    if(it.username){
      if(seenInFile[it.username]){
        errs.push('表格内账号重复');
      }else if(exist){
        if(isSuperAdmin(exist)){
          errs.push('账号与超级管理员冲突，不能覆盖');
        }else if(opts.dupPolicy === 'overwrite'){
          it.act = 'update';
        }else if(opts.dupPolicy === 'skip'){
          it.act = 'skip';
          it.msg = '账号已存在，将跳过';
        }else{
          errs.push('账号已存在');
        }
      }
      seenInFile[it.username] = true;
    }

    if(errs.length){
      it.act = 'error';
      it.msg = errs.join('；');
    }
    items.push(it);
  }

  if(!items.length) throw new Error('表头下方没有可导入的数据行');

  const stats = {
    total : items.length,
    new_  : items.filter(x => x.act === 'new').length,
    update: items.filter(x => x.act === 'update').length,
    skip  : items.filter(x => x.act === 'skip').length,
    error : items.filter(x => x.act === 'error').length
  };
  return { items, stats, headerRowNo: lines[headRow].rowNo };
}

/* ---------- 5.9.7 执行导入 ---------- */
function executeImport(items, opts){
  const t = nowISO();
  const stats = { orgCreated: 0, deptCreated: 0, inserted: 0, updated: 0, skipped: 0, failed: 0 };
  const rows = items.slice();

  /* 1) 补齐缺失机构 */
  const orgOf = {};
  DB.organizations.forEach(o => { orgOf[o.name] = o.id; });
  rows.forEach(r => {
    if(r.act !== 'new' && r.act !== 'update') return;
    if(r.deptId || !r.org) return;
    if(!orgOf[r.org]){
      const id = uid('o');
      DB.organizations.push({ id, name: r.org, desc: '批量导入自动创建', createdAt: t });
      orgOf[r.org] = id;
      stats.orgCreated++;
    }
  });

  /* 2) 补齐缺失部门 */
  const deptOf = {};
  DB.departments.forEach(d => { deptOf[d.name] = d.id; });
  rows.forEach(r => {
    if(r.act !== 'new' && r.act !== 'update') return;
    if(r.deptId) return;
    if(!deptOf[r.deptName]){
      if(!r.org || !orgOf[r.org]){
        r.act = 'error';
        r.msg = '部门不存在且无法确定所属机构：' + r.deptName;
        return;
      }
      const id = uid('d');
      DB.departments.push({
        id, orgId: orgOf[r.org], name: r.deptName,
        desc: '批量导入自动创建', leader: '', phone: '', createdAt: t
      });
      deptOf[r.deptName] = id;
      stats.deptCreated++;
    }
    r.deptId = deptOf[r.deptName];
    /* 表格里指定的机构与已有部门的归属不一致时，以表格为准 */
    if(r.org && orgOf[r.org]){
      const d = getDept(r.deptId);
      if(d && d.orgId !== orgOf[r.org]) d.orgId = orgOf[r.org];
    }
  });

  /* 3) 落库（人员） */
  const seen = {};
  rows.forEach(r => {
    if(r.act === 'skip'){ stats.skipped++; return; }
    if(r.act === 'error'){ stats.failed++; return; }
    if(seen[r.username]){
      r.act = 'error';
      r.msg = '表格内账号重复：' + r.username;
      stats.failed++;
      return;
    }
    seen[r.username] = true;

    const exist = DB.users.find(u => u.username === r.username);
    if(exist){
      if(r.act !== 'update'){ stats.skipped++; return; }
      Object.assign(exist, {
        name       : r.name,
        password   : r.password || exist.password,
        rank       : r.rank,
        title      : r.title || rankLabel(r.rank),
        departmentId: r.deptId,
        phone      : r.phone || exist.phone || '',
        status     : r.status
      });
      stats.updated++;
    }else{
      DB.users.push({
        id: uid('u'), username: r.username,
        password: r.password || opts.defaultPassword || '123456',
        role: 'staff', rank: r.rank,
        title: r.title || rankLabel(r.rank),
        name: r.name, departmentId: r.deptId,
        phone: r.phone || '', status: r.status, createdAt: t
      });
      stats.inserted++;
    }
  });

  saveAll();
  const failedRows = rows.filter(r => r.act === 'error');
  addLog(currentUser.id, '批量导入人员：新增 ' + stats.inserted + ' 人，更新 ' + stats.updated +
    ' 人，跳过 ' + stats.skipped + ' 人，失败 ' + stats.failed + ' 条');
  return { stats, failedRows, createdAt: t };
}

/* ---------- 5.9.8 导入页面状态（跨刷新保留） ---------- */
const IMPORT_OPTS_DEFAULT = { defaultPassword: '123456', dupPolicy: 'skip', autoCreate: true, enableAll: false };
const IMPORT_CACHE = {
  fileName : '',
  sheets   : null,
  sheetIdx : 0,
  opts     : Object.assign({}, IMPORT_OPTS_DEFAULT),
  lastResult: null
};

function pickDefaultSheet(sheets){
  for(let i = 0; i < sheets.length; i++){
    if(sheets[i].rows.some(r => r && r.some(c => String(c || '').trim() !== ''))) return i;
  }
  return 0;
}

          <input type="file" id="fileInput" accept=".xlsx,.csv,.txt" class="hidden">
        </div>
        <div id="fileInfo" style="margin-top:12px;font-size:13px;"></div>
        <p class="muted" style="margin-top:14px;font-size:12.5px;line-height:1.95;">
          <b>必填列</b>：姓名、账号、部门 &nbsp;·&nbsp; <b>可选列</b>：机构、密码、职级、岗位、电话、状态<br>
          列名支持常见写法（如「用户名 / 登录账号 / 学号」「手机 / 联系电话」「职位 / 职务」），系统自动识别，列的顺序随意。<br>
          密码列留空时使用下方「默认密码」；职级留空时会根据岗位名称自动判断正职 / 副职 / 干事。
        </p>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h3>导入选项</h3></div>
      <div class="card-body">
        <div class="grid-2">
          <div class="field"><label>默认密码（表格密码列为空时使用）</label>
            <input id="optPwd" value="${esc(C.opts.defaultPassword)}"></div>
          <div class="field"><label>遇到已存在的账号</label>
            <select id="optDup">
              <option value="skip"      ${C.opts.dupPolicy === 'skip'      ? 'selected' : ''}>跳过（保留原账号信息）</option>
              <option value="overwrite" ${C.opts.dupPolicy === 'overwrite' ? 'selected' : ''}>覆盖更新（用表格内容更新该账号）</option>
              <option value="error"     ${C.opts.dupPolicy === 'error'     ? 'selected' : ''}>视为错误并列出</option>
            </select></div>
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:10px;cursor:pointer;">
          <input type="checkbox" id="optAuto" ${C.opts.autoCreate ? 'checked' : ''} style="width:16px;height:16px;">

        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;">
          <input type="checkbox" id="optEnable" ${C.opts.enableAll ? 'checked' : ''} style="width:16px;height:16px;">
          忽略表格「状态」列，导入后账号一律设为启用
        </label>

    <div id="previewBox"></div>

  `;

  const dropZone  = $('#dropZone', el);
  const fileInput = $('#fileInput', el);
  const previewBox= $('#previewBox', el);
  const resultBox = $('#resultBox', el);

  /* ---- 选项绑定 ---- */
  function readOpts(){
    C.opts.defaultPassword = $('#optPwd', el).value.trim() || '123456';
    C.opts.dupPolicy = $('#optDup', el).value;
    C.opts.autoCreate = $('#optAuto', el).checked;
    C.opts.enableAll  = $('#optEnable', el).checked;
  }
  ['#optPwd', '#optDup', '#optAuto', '#optEnable'].forEach(sel => {
    const node = $(sel, el);
    if(node) node.addEventListener('change', () => { readOpts(); renderPreview(); });
  });

  /* ---- 文件选择 ---- */
  dropZone.onclick = () => fileInput.click();
  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.style.borderColor = '#2563eb';
    dropZone.style.background  = '#eff6ff';
  });
  dropZone.addEventListener('dragleave', () => {
    dropZone.style.borderColor = '#cbd5e1';
    dropZone.style.background  = '#f8fafc';
  });

    e.preventDefault();
    dropZone.style.borderColor = '#cbd5e1';
    dropZone.style.background  = '#f8fafc';
    if(e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.onchange = () => {
    if(fileInput.files[0]) handleFile(fileInput.files[0]);
    fileInput.value = '';
  };

  async function handleFile(file){
    readOpts();
    const name = file.name || '';
    const ext  = (name.split('.').pop() || '').toLowerCase();
    const info = $('#fileInfo', el);
    info.innerHTML = '<span class="muted">正在解析 ' + esc(name) + ' …</span>';

    try{
      if(ext === 'xls'){
        throw new Error('检测到旧版 .xls 格式。请在 Excel / WPS 中「另存为」.xlsx 或 CSV 后再导入。');
      }
      let sheets;
      if(ext === 'csv' || ext === 'txt'){
        sheets = readCsvSheets(await file.text());
      }else{
        const head = new Uint8Array((await file.slice(0, 8).arrayBuffer()));
        const isOle = head[0] === 0xD0 && head[1] === 0xCF && head[2] === 0x11 && head[3] === 0xE0;
        const isZip = head[0] === 0x50 && head[1] === 0x4B;
        if(isOle) throw new Error('检测到旧版 .xls 格式。请另存为 .xlsx 或 CSV 后再导入。');
        if(!isZip) throw new Error('文件格式无法识别，请上传 .xlsx 或 .csv 文件。');

      C.sheets   = sheets;
      C.sheetIdx = pickDefaultSheet(sheets);
      C.lastResult = null;
      info.innerHTML = '<span style="color:#16a34a;">✅ 已解析：' + esc(name) + '（共 ' + sheets.length +
        ' 个工作表，当前使用「' + esc(sheets[C.sheetIdx].name) + '」）</span>';
      renderPreview();
    }catch(err){
      C.sheets = null;
      C.lastResult = null;
      info.innerHTML = '<span style="color:#dc2626;">❌ ' + esc(err && err.message || String(err)) + '</span>';
      previewBox.innerHTML = '';
      resultBox.innerHTML = '';
    }
  }

  /* ---- 预览渲染 ---- */
  function renderPreview(){
    resultBox.innerHTML = '';
    if(!C.sheets){
      previewBox.innerHTML = '';
      return;
    }
    let data;
    try{
      data = analyzeSheet(C.sheets, C.sheetIdx, C.opts);
    }catch(err){
      previewBox.innerHTML = `
        <section class="card">
          <div class="card-head"><h3>数据预览</h3></div>
          <div class="card-body">
            <p style="color:#dc2626;">❌ ${esc(err && err.message || String(err))}</p>
          </div>
        </section>`;
      return;
    }

    const s = data.stats;
    const rows = data.items;
    const LIMIT = 200;
    const shown = rows.slice(0, LIMIT);

    const actBadge = a => a === 'new'    ? '<span class="badge badge-green">新增</span>'
                        : a === 'update' ? '<span class="badge badge-blue">覆盖</span>'
                        : a === 'skip'   ? '<span class="badge badge-gray">跳过</span>'
                        :                  '<span class="badge badge-red">错误</span>';

    const sheetPicker = C.sheets.length > 1 ? `
      <select id="sheetSel" style="padding:8px 12px;border:1px solid var(--border);border-radius:8px;">
        ${C.sheets.map((sh, i) => `<option value="${i}" ${i === C.sheetIdx ? 'selected' : ''}>${esc(sh.name)}</option>`).join('')}
      </select>` : '';

    previewBox.innerHTML = `
      <div class="stat-grid">
        ${statCard('📄', '表格数据行', s.total,  '#2563eb')}
        ${statCard('✅', '将新增',     s.new_,   '#16a34a')}
        ${statCard('🔁', '将覆盖',     s.update, '#0891b2')}
        ${statCard('⚠️', '跳过 / 错误', s.skip + ' / ' + s.error, '#dc2626')}
      </div>

      <section class="card">
        <div class="card-head">
          <h3>数据预览（表头在第 ${data.headerRowNo} 行）</h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
            ${sheetPicker}
            <button class="btn btn-success" id="runImportBtn" ${s.new_ + s.update === 0 ? 'disabled' : ''}>
              开始导入（${s.new_ + s.update} 条）
            </button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>行号</th><th>状态</th><th>机构</th><th>部门</th><th>姓名</th><th>账号</th>
                  <th>密码</th><th>职位</th><th>职级</th><th>电话</th><th>说明</th></tr>
            </thead>
            <tbody>
              ${shown.map(it => `
                <tr>
                  <td class="muted">${it.rowNo}</td>
                  <td>${actBadge(it.act)}</td>
                  <td>${esc(it.org || '—')}</td>
                  <td>${esc(it.deptName || '—')}</td>
                  <td><strong>${esc(it.name || '—')}</strong></td>
                  <td>${esc(it.username || '—')}</td>
                  <td class="muted">${it.password ? '••••••' : '（默认）'}</td>
                  <td>${esc(it.title || '—')}</td>
                  <td>${rankBadge(it.rank)}</td>
                  <td>${esc(it.phone || '—')}</td>
                  <td class="muted" style="white-space:normal;max-width:220px;">${esc(it.msg || '')}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <div class="card-body" style="padding-top:0;">
          <p class="muted" style="font-size:12.5px;">
            ${rows.length > LIMIT ? '仅显示前 ' + LIMIT + ' 行，共 ' + rows.length + ' 行。' : ''}
            部门不存在时会${C.opts.autoCreate ? '<b style="color:#16a34a;">自动创建</b>' : '报错'}；
            已存在的账号按「${C.opts.dupPolicy === 'skip' ? '跳过' : (C.opts.dupPolicy === 'overwrite' ? '覆盖更新' : '视为错误')}」处理。
          </p>
        </div>
      </section>`;

    const sel = $('#sheetSel', previewBox);
    if(sel) sel.onchange = e => { C.sheetIdx = Number(e.target.value); renderPreview(); };

    const runBtn = $('#runImportBtn', previewBox);
    if(runBtn) runBtn.onclick = () => {
      readOpts();
      const willDo = s.new_ + s.update;
      confirmModal(
        '确认导入 ' + willDo + ' 条人员数据吗？' +
        (s.update ? '其中 ' + s.update + ' 条会覆盖已有账号的信息。' : '') +
        (s.error ? '另有 ' + s.error + ' 条存在错误，将被忽略。' : ''),
        () => {
          const res = executeImport(data.items, C.opts);
          C.lastResult = { res, total: s.total };
          toast('导入完成：新增 ' + res.stats.inserted + ' 人，更新 ' + res.stats.updated +
                ' 人' + (res.stats.failed ? '，失败 ' + res.stats.failed + ' 条' : ''));
          renderResult();
          refresh();
        }, '确认导入');
    };
  }

  /* ---- 结果渲染 ---- */
  function renderResult(){
    const R = C.lastResult;
    if(!R){ resultBox.innerHTML = ''; return; }
    const st = R.res.stats;
    resultBox.innerHTML = `
      <section class="card">
        <div class="card-head">
          <h3>导入结果</h3>
          <div style="display:flex;gap:8px;">
            ${R.res.failedRows.length ? '<button class="btn btn-sm btn-ghost" id="dlFailBtn">导出失败明细</button>' : ''}
            <button class="btn btn-sm btn-ghost" id="closeResultBtn">关闭</button>
          </div>
        </div>
        <div class="card-body">
          <div class="stat-grid">
            ${statCard('✅', '新增人员', st.inserted, '#16a34a')}
            ${statCard('🔁', '更新人员', st.updated,  '#0891b2')}
            ${statCard('➕', '新建部门', st.deptCreated, '#2563eb')}
            ${statCard('⚠️', '失败',     st.failed,   '#dc2626')}
          </div>
          ${R.res.failedRows.length ? `
            <p class="muted" style="margin:6px 0 8px;">以下 ${R.res.failedRows.length} 条未导入：</p>
            <div class="table-wrap">
              <table>
                <thead><tr><th>行号</th><th>姓名</th><th>账号</th><th>部门</th><th>原因</th></tr></thead>
                <tbody>
                  ${R.res.failedRows.map(it => `
                    <tr>
                      <td class="muted">${it.rowNo}</td>
                      <td>${esc(it.name || '—')}</td>
                      <td>${esc(it.username || '—')}</td>
                      <td>${esc(it.deptName || '—')}</td>
                      <td style="color:#dc2626;white-space:normal;">${esc(it.msg || '')}</td>
                    </tr>`).join('')}
                </tbody>
              </table>
            </div>` : '<p style="color:#16a34a;margin-top:6px;">✅ 全部数据导入成功，无失败记录。</p>'}
          ${(st.orgCreated || st.deptCreated) ? `<p class="muted" style="margin-top:10px;font-size:12.5px;">
            本次自动创建：机构 ${st.orgCreated} 个、部门 ${st.deptCreated} 个。可到「组织架构」中补充负责人等信息。</p>` : ''}
        </div>
      </section>`;

    const dl = $('#dlFailBtn', resultBox);
    if(dl) dl.onclick = () => {
      downloadText('导入失败明细-' + Date.now() + '.csv', toCSV(
        ['行号', '机构', '部门', '姓名', '账号', '职位', '电话', '失败原因'],
        R.res.failedRows.map(it => [it.rowNo, it.org, it.deptName, it.name, it.username, it.title, it.phone, it.msg])
      ));
      toast('失败明细已导出');
    };
    const cl = $('#closeResultBtn', resultBox);
    if(cl) cl.onclick = () => { C.lastResult = null; resultBox.innerHTML = ''; };
  }

  /* ---- 模板 / 导出 ---- */
  $('#tplBtn', el).onclick = () => {
    const heads = ['机构', '部门', '姓名', '账号', '密码', '职级', '岗位', '电话', '状态'];
    const sample = DB.departments.slice(0, 3).map((d, i) => [
      orgName(d.orgId), d.name,
      '示例姓名' + (i + 1), 'demo' + (i + 1), '123456',
      '干事', '干事', '1380000000' + i, '启用'
    ]);
    downloadText('人员导入模板.csv', toCSV(heads, sample));
    toast('模板已下载，可用 Excel / WPS 打开填写（建议另存为 xlsx）');
  };
  $('#expBtn', el).onclick = () => {
    const heads = ['机构', '部门', '姓名', '账号', '密码', '职级', '岗位', '电话', '状态'];
    const rows = DB.users.map(u => [
      u.role === 'admin' ? '系统管理' : deptOrgName(u.departmentId),
      u.role === 'admin' ? '管理员' : deptName(u.departmentId),
      u.name, u.username, u.password,
      u.role === 'admin' ? '' : u.rank,
      u.title || '', u.phone || '', u.status === 1 ? '启用' : '禁用'
    ]);
    downloadText('当前人员名单-' + Date.now() + '.csv', toCSV(heads, rows));
    toast('已导出 ' + DB.users.length + ' 条人员记录（含明文密码，请妥善保管）');
  };

  if(C.sheets){
    const info = $('#fileInfo', el);
    info.innerHTML = '<span style="color:#16a34a;">✅ 已解析：' + esc(C.fileName) + '（共 ' +
      C.sheets.length + ' 个工作表，当前使用「' + esc(C.sheets[C.sheetIdx].name) + '」）</span>';
  }
  renderPreview();
  renderResult();
}

/* ----------------------------------------------------------------
 * 5.9 通知中心：站内通知 + 电脑桌面通知 + 手机推送
 *     手机推送通道：
 *     · Server酱（sct.ftqq.com）→ 微信服务号消息，填 SendKey 即用
 *     · ntfy（ntfy.sh）→ 手机装 ntfy App 订阅主题即可，免费无注册
 * ---------------------------------------------------------------- */

/** 接收人：任务目标对应的用户 id 列表 */
function taskTargetUserIds(t){
  if(!t) return [];
  if(t.targetType === 'user') return [t.targetId];
  return DB.users.filter(u => u.status === 1 && u.departmentId === t.targetId).map(u => u.id);
}
const allActiveUserIds = () => DB.users.filter(u => u.status === 1).map(u => u.id);

/**
 * 发送一条通知
 * @param {string} title    标题
 * @param {string} body     正文
 * @param {string[]} [ids]  接收人用户 id（缺省为全员）
 */
function pushNotify(title, body, ids){
  const targetIds = ids && ids.length ? ids : allActiveUserIds();
  DB.notifications.unshift({
    id: uid('nt'), title, body: body || '',
    targetIds, creatorId: currentUser ? currentUser.id : '',
    createdAt: nowISO()
  });
  if(DB.notifications.length > 300) DB.notifications.length = 300;
  saveAll();
  renderBell();

  /* 电脑桌面通知（需用户在系统设置中授权） */
  try{
    if(window.Notification && Notification.permission === 'granted'){
      new Notification('【明德书院协同系统】' + title, { body: body || '', tag: 'sms-notify' });
    }
  }catch(_){}

  /* 手机推送：Server酱 → 微信 */
  const cfg = DB.pushCfg || {};
  if(cfg.serverchanKey){
    try{
      fetch('https://sctapi.ftqq.com/' + encodeURIComponent(cfg.serverchanKey) + '.send', {
        method : 'POST',
        mode   : 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body   : 'title=' + encodeURIComponent(title) + '&desp=' + encodeURIComponent(body || '')
      }).catch(() => {});
    }catch(_){}
  }
  /* 手机推送：ntfy → ntfy App / 电脑浏览器订阅 */
  if(cfg.ntfyTopic){
    try{
      fetch('https://ntfy.sh/' + encodeURIComponent(cfg.ntfyTopic), {
        method : 'POST',
        headers: { 'Title': '【协同系统】' + title, 'Tags': 'bell', 'Priority': 'default' },
        body   : (body || '')
      }).catch(() => {});
    }catch(_){}
  }
}

/** 当前用户未读通知数 */
function unreadNotifCount(){
  if(!currentUser) return 0;
  const last = (DB.notifReads || {})[currentUser.id] || '';
  return DB.notifications.filter(n =>
    (!n.targetIds || n.targetIds.length === 0 || n.targetIds.includes(currentUser.id)) &&
    n.createdAt > last
  ).length;
}

/** 渲染顶栏铃铛（红点 + 下拉面板） */
function renderBell(){
  const badge = document.getElementById('bellBadge');
  const panel = document.getElementById('bellPanel');
  if(!badge || !currentUser) return;
  const unread = unreadNotifCount();
  badge.style.display = unread > 0 ? '' : 'none';
  badge.textContent = unread > 99 ? '99+' : unread;

  if(panel && panel.style.display !== 'none'){
    const last = (DB.notifReads || {})[currentUser.id] || '';
    const list = DB.notifications.filter(n =>
      !n.targetIds || n.targetIds.length === 0 || n.targetIds.includes(currentUser.id)
    ).slice(0, 30);
    panel.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);">
        <strong style="font-size:14px;">通知中心</strong>
        <button class="btn btn-sm btn-ghost" id="markAllRead">全部已读</button>
      </div>
      ${ list.length ? list.map(n => `
        <div style="padding:10px 14px;border-bottom:1px solid var(--border);">
          <div style="font-size:13.5px;font-weight:600;">${n.createdAt > last ? '<span style="color:#dc2626;">●</span> ' : ''}${esc(n.title)}</div>
          <div class="muted" style="font-size:12px;margin-top:3px;white-space:normal;">${esc((n.body || '').slice(0, 80))}</div>
          <div class="muted" style="font-size:11px;margin-top:2px;">${fmt(n.createdAt)} · ${esc(userName(n.creatorId))}</div>
        </div>`).join('')
      : '<div class="muted" style="padding:24px;text-align:center;">暂无通知</div>' }`;
    const mk = panel.querySelector('#markAllRead');
    if(mk) mk.onclick = () => {
      DB.notifReads[currentUser.id] = nowISO();
      saveAll();
      renderBell();
    };
  }
}

/** 请求桌面通知授权 */
function askDesktopNotify(){
  try{
    if(!window.Notification){ toast('当前浏览器不支持桌面通知', 'error'); return; }
    if(Notification.permission === 'granted'){ toast('桌面通知已开启'); return; }
    Notification.requestPermission().then(p => {
      toast(p === 'granted' ? '桌面通知已开启，电脑端可收到弹窗提醒' : '您拒绝了桌面通知授权', p === 'granted' ? '' : 'warn');
    });
  }catch(e){ toast('桌面通知不可用：' + e.message, 'error'); }
}

/** 发送测试推送（验证手机通道是否配置正确） */
async function testPush(channel){
  const cfg = DB.pushCfg || {};
  const title = '✅ 测试推送';
  const body  = '这是一条来自「明德书院协同管理系统」的测试消息，收到即表示通道配置成功。';
  try{
    if(channel === 'serverchan'){
      if(!cfg.serverchanKey){ toast('请先填写 Server酱 SendKey', 'error'); return; }
      await fetch('https://sctapi.ftqq.com/' + encodeURIComponent(cfg.serverchanKey) + '.send', {
        method : 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body   : 'title=' + encodeURIComponent(title) + '&desp=' + encodeURIComponent(body)
      });
      toast('测试指令已发送，请查看微信（Server酱服务号）');
    }else if(channel === 'ntfy'){
      if(!cfg.ntfyTopic){ toast('请先填写 ntfy 主题名称', 'error'); return; }
      await fetch('https://ntfy.sh/' + encodeURIComponent(cfg.ntfyTopic), {
        method : 'POST',
        headers: { 'Title': title, 'Tags': 'white_check_mark' },
        body
      });
      toast('测试指令已发送，请查看 ntfy App / 网页');
    }
  }catch(e){ toast('发送失败：' + e.message, 'error'); }
}

/* ----------------------------------------------------------------
 * 6. 全局事件绑定 & 启动
 * ---------------------------------------------------------------- */
function bindGlobal(){
  /* 角色切换 */
  $$('.role-tab').forEach(tab => {
    tab.onclick = () => {
      $$('.role-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      loginRole = tab.dataset.role;
    };
  });

  /* 登录 */
  $('#loginBtn').onclick = doLogin;
  $('#loginPass').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
  $('#loginUser').addEventListener('keydown', e => { if(e.key === 'Enter') $('#loginPass').focus(); });

  /* 退出 */
  $('#logoutBtn').onclick = doLogout;

  /* 通知铃铛 */
  const bellBtn = document.getElementById('bellBtn');
  const bellPanel = document.getElementById('bellPanel');
  bellBtn.onclick = e => {
    e.stopPropagation();
    bellPanel.style.display = bellPanel.style.display === 'none' ? '' : 'none';
    renderBell();
  };
  document.addEventListener('click', e => {
    if(bellPanel && bellPanel.style.display !== 'none' &&
       !bellPanel.contains(e.target) && e.target !== bellBtn){
      bellPanel.style.display = 'none';
    }
  });
  bellPanel.addEventListener('click', e => e.stopPropagation());

  /* 登录页：显示当前存储模式 */
  const tip = document.getElementById('loginStorageTip');
  if (tip){
    tip.textContent = storageMode === 'memory'
      ? '⚠️ 当前为「内存模式」：浏览器不允许本地存储，关闭页面后数据将丢失。请定期使用「导出 JSON」备份。'
      : '✅ 本地存储已启用：数据会保存在浏览器中。';
    tip.style.color = storageMode === 'memory' ? '#dc2626' : '#16a34a';
  }

  /* 登录页：若当前系统中还没有任何部门人员账号，给出提示 */
  const loginTipBox = document.querySelector('#loginPage .login-tip');
  if (loginTipBox){
    const old = loginTipBox.querySelector('.sys-hint');
    if (old) old.remove();
    const staffCount = DB.users.filter(u => u.role === 'staff').length;
    if (staffCount === 0){
      const hint = document.createElement('div');
      hint.className = 'sys-hint';
      hint.style.cssText = 'margin-top:8px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;text-align:left;';
      hint.textContent = '提示：当前系统中暂无部门人员账号，请使用「辅导员 / 管理员」登录，在「人员管理」中创建部门人员账号后，部门人员方可登录。';
      loginTipBox.appendChild(hint);
    }
  }

  /* 登录页：一键清除全部浏览器数据，恢复初始空库 */
  const resetAll = document.getElementById('resetAllBtn');
  if (resetAll){
    resetAll.onclick = () => {
      if (!confirm('确定清除浏览器中的全部数据，并恢复为初始状态吗？\n（组织架构与 1 个管理员账号会保留，其余人员与业务数据将全部删除）')) return;
      try { localStorage.clear(); } catch(_){}
      /* 内存里的也一并清掉 */
      ['ver','orgs','dept','users','tasks','notices','apps','logs','cur','read'].forEach(k => Store.remove(K[k]));
      seedData();
      loadAll();
      currentUser = null;
      Store.remove(K.cur);
      alert('已重置为初始状态，请使用管理员账号登录。');
      location.reload();
    };
  }

  /* 移动端侧栏 */
  $('#menuToggle').onclick = () => {
    $('#sidebar').classList.toggle('open');
    $('#overlay').classList.toggle('show');
  };
  $('#overlay').onclick = () => {
    $('#sidebar').classList.remove('open');
    $('#overlay').classList.remove('show');
  };

  /* 路由变化 */
  window.addEventListener('hashchange', route);
}

function init(){
  /* 首次访问初始化数据 —— 整个流程用 try-catch 兜底 */
  try {
    Store.available();
    storageMode = Store.mode();
    /* 无数据、或数据版本已变更（本次为「清空演示数据」），都重建为初始空库 */
    const storedVer = Number(Store.get(K.ver, 0) || 0);
    if(!loadKey(K.users, null) || storedVer !== DATA_VERSION){
      seedData();
    }
    loadAll();
    /* 旧数据平滑升级：确保系统内存在超级管理员（不删除任何业务数据） */
    if(ensureSuperAdmin()) saveAll();
    restoreSession();
  } catch(err) {
    console.error('[init 异常]', err);
    /* 即使初始化失败，也保证用户能看到登录页 */
    document.getElementById('loginPage').classList.remove('hidden');
    document.getElementById('appPage').classList.add('hidden');
    toast('初始化失败：' + (err && err.message || err), 'error');
    /* 显示详细错误到登录页顶部 */
    var lp = document.getElementById('loginPage');
    if (lp){
      var tip = lp.querySelector('.login-tip');
      if (tip){
        tip.innerHTML = '<b style="color:#dc2626;">⚠️ 数据加载失败，请尝试：</b><br>' +
          '1) 刷新页面重试 &nbsp; 2) 使用「导出 JSON」备份数据<br>' +
          '<span style="color:#6b7280;font-size:11px;">错误详情：' + esc(String(err && err.message || err)) + '</span>';
      }
    }
  }
  bindGlobal();
  route();
  /* 内存模式下提示用户 */
  if (storageMode === 'memory'){
    setTimeout(function(){
      toast('当前浏览器禁用了本地存储，数据仅在本次会话保留。建议通过「导出 JSON」手动备份。', 'warn');
    }, 600);
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
