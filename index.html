<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学校多部门协同管理系统</title>
<style>
/* ============================================================
   基础样式
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --primary:#2563eb; --primary-d:#1d4ed8; --warn:#f59e0b; --danger:#dc2626;
  --success:#16a34a; --bg:#f4f6fb; --text:#1f2937; --muted:#6b7280; --border:#e5e7eb;
}
html,body{height:100%;}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; line-height:1.6;
}
button{font-family:inherit;cursor:pointer;border:0;}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);}
.hidden{display:none !important;}
.muted{color:var(--muted);}
.overdue{color:var(--danger);font-weight:600;}

/* ============================================================
   登录页
   ============================================================ */
.login-page{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 45%,#38bdf8 100%);
}
.login-card{
  width:100%;max-width:400px;background:#fff;border-radius:16px;padding:36px 30px 28px;
  box-shadow:0 20px 50px rgba(0,0,0,.25);animation:pop .25s ease;
}
.login-logo{font-size:46px;text-align:center;line-height:1;}
.login-card h1{font-size:20px;text-align:center;margin-top:10px;letter-spacing:1px;}
.login-card .sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:22px;}
.role-tabs{display:flex;background:#f1f5f9;border-radius:10px;padding:4px;margin-bottom:18px;}
.role-tab{
  flex:1;background:transparent;padding:9px 0;border-radius:8px;color:var(--muted);
  font-size:14px;transition:.2s;
}
.role-tab.active{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.08);}
.login-tip{margin-top:16px;font-size:12px;color:var(--muted);text-align:center;line-height:1.9;}

/* ============================================================
   表单 & 按钮
   ============================================================ */
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;color:#374151;margin-bottom:6px;font-weight:500;}
.field label i{color:var(--danger);font-style:normal;}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
  outline:none;transition:.2s;background:#fff;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12);
}
.field input[readonly]{background:#f8fafc;color:var(--muted);}
.btn{
  border-radius:8px;padding:9px 16px;font-size:14px;background:#e5e7eb;color:#374151;
  transition:.18s;white-space:nowrap;display:inline-block;
}
.btn:hover{filter:brightness(.95);}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-warn{background:var(--warn);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-success{background:var(--success);color:#fff;}
.btn-ghost{background:#f1f5f9;color:#475569;border:1px solid var(--border);}
.btn-block{width:100%;padding:12px;font-size:16px;letter-spacing:4px;}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:6px;}
.ops{display:flex;gap:6px;flex-wrap:wrap;}

/* ============================================================
   应用主框架
   ============================================================ */
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{
  width:220px;flex:0 0 220px;background:#0f172a;color:#cbd5e1;
  display:flex;flex-direction:column;overflow-y:auto;
}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand span{font-size:26px;}
.brand strong{display:block;color:#fff;font-size:15px;}
.brand small{font-size:11px;color:#94a3b8;}
#menu{padding:10px;display:flex;flex-direction:column;gap:4px;}
.menu-item{
  display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:8px;
  color:#cbd5e1;text-decoration:none;font-size:14px;transition:.2s;
}
.menu-item:hover{background:rgba(255,255,255,.08);color:#fff;}
.menu-item.active{background:var(--primary);color:#fff;font-weight:600;}
.menu-item .ic{font-size:16px;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{
  height:60px;flex:0 0 60px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 20px;
}
.topbar h2{font-size:17px;font-weight:600;flex:1;}
.user-box{display:flex;align-items:center;gap:12px;}
.user-meta{text-align:right;line-height:1.3;}
.user-meta strong{display:block;font-size:14px;}
.user-meta span{font-size:12px;color:var(--muted);}
.icon-btn{display:none;background:transparent;font-size:20px;padding:6px 10px;border-radius:8px;}
.icon-btn:hover{background:#f1f5f9;}
.content{flex:1;overflow-y:auto;padding:20px;}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:880;}

/* ============================================================
   卡片 / 表格 / 徽章
   ============================================================ */
.card{
  background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(15,23,42,.06);
  margin-bottom:18px;overflow:hidden;
}
.card-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;
}
.card-head h3{font-size:15px;}
.card-body{padding:16px 18px;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;min-width:680px;}
th,td{padding:11px 14px;text-align:left;font-size:13.5px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
th{background:#f8fafc;color:#475569;font-weight:600;white-space:nowrap;}
tbody tr:hover{background:#f8fafc;}
td{white-space:nowrap;}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;line-height:1.7;}
.badge-blue{background:#dbeafe;color:#1d4ed8;}
.badge-orange{background:#ffedd5;color:#c2410c;}
.badge-green{background:#dcfce7;color:#15803d;}
.badge-red{background:#fee2e2;color:#b91c1c;}
.badge-gray{background:#e5e7eb;color:#4b5563;}

/* ============================================================
   统计卡片 / 网格 / 进度条
   ============================================================ */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:18px;}
.stat-card{
  background:#fff;border-radius:12px;padding:18px;display:flex;align-items:center;gap:14px;
  box-shadow:0 1px 3px rgba(15,23,42,.06);
}
.stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.stat-value{font-size:24px;font-weight:700;line-height:1.2;}
.stat-label{font-size:13px;color:var(--muted);}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;}
.progress{height:10px;background:#eef2f7;border-radius:999px;overflow:hidden;min-width:110px;}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#22c55e);border-radius:999px;transition:width .4s;}
.list-item{padding:12px 0;border-bottom:1px dashed var(--border);}
.list-item:last-child{border-bottom:0;}
.list-item .t{font-weight:600;font-size:14px;}
.list-item .m{font-size:12.5px;color:var(--muted);margin-top:3px;word-break:break-all;white-space:normal;}
.detail p{margin-bottom:7px;font-size:13.5px;word-break:break-all;white-space:normal;}
.detail p b{color:#374151;}

/* ============================================================
   弹窗
   ============================================================ */
.modal-mask{
  position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;
  justify-content:center;z-index:1000;padding:16px;
}
.modal{
  background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:90vh;
  display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s ease;
}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px;}
.modal-close{background:transparent;font-size:16px;color:var(--muted);border-radius:6px;padding:2px 8px;}
.modal-close:hover{background:#f1f5f9;}
.modal-body{padding:18px 20px;overflow-y:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border);}

/* ============================================================
   Toast
   ============================================================ */
#toastBox{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:2000;
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;
}
.toast{
  background:#111827;color:#fff;padding:10px 22px;border-radius:999px;font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.22);animation:slideDown .25s ease;transition:.3s;
  max-width:90vw;text-align:center;
}
.toast.success{background:var(--success);}
.toast.error{background:var(--danger);}
.toast.warn{background:var(--warn);}
.toast.out{opacity:0;transform:translateY(-10px);}
@keyframes slideDown{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:translateY(0);}}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width:820px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:900;transform:translateX(-100%);transition:transform .25s;}
  .sidebar.open{transform:translateX(0);}
  .overlay.show{display:block;}
  .icon-btn{display:block;}
  .content{padding:14px;}
  .user-meta{display:none;}
  .topbar{padding:0 12px;}
  .topbar h2{font-size:16px;}
}
</style>
</head>
<body>

<!-- ==================== 登录页 ==================== -->
<div id="loginPage" class="login-page">
  <div class="login-card">
    <div class="login-logo">🎓</div>
    <h1>学校多部门协同管理系统</h1>
    <p class="sub">School Multi-Department Collaboration System</p>

    <div class="role-tabs">
      <button class="role-tab active" data-role="admin">辅导员 / 管理员</button>
      <button class="role-tab" data-role="staff">部门人员 / 学生干部</button>
    </div>

    <div class="field">
      <label>账号</label>
      <input id="loginUser" placeholder="请输入账号" autocomplete="off">
    </div>
    <div class="field">
      <label>密码</label>
      <input id="loginPass" type="password" placeholder="请输入密码">
    </div>
    <button class="btn btn-primary btn-block" id="loginBtn">登 录</button>
    <div class="login-tip">
      账号由管理员统一开通分配，如需使用请联系辅导员。<br>
      <span id="loginStorageTip" class="muted" style="font-size:11px;">检测存储模式...</span>
    </div>
    <div style="text-align:center;margin-top:10px;">
      <button class="btn btn-sm btn-ghost" id="resetAllBtn" type="button" style="font-size:12px;">清除浏览器数据并重置</button>
    </div>
  </div>
</div>

<!-- ==================== 主应用 ==================== -->
<div id="appPage" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span>🎓</span>
      <div><strong>协同管理系统</strong><small>多部门协作平台</small></div>
    </div>
    <nav id="menu"></nav>
  </aside>
  <div class="overlay" id="overlay"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuToggle">☰</button>
      <h2 id="pageTitle">仪表盘</h2>
      <div class="user-box">
        <div style="position:relative;">
          <button class="icon-btn" id="bellBtn" title="通知中心">🔔</button>
          <i id="bellBadge" style="display:none;position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;line-height:16px;text-align:center;border-radius:8px;background:#dc2626;color:#fff;font-size:10px;font-style:normal;padding:0 3px;"></i>
          <div id="bellPanel" style="display:none;position:absolute;right:0;top:36px;width:320px;max-width:86vw;max-height:60vh;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.12);z-index:60;"></div>
        </div>
        <div class="user-meta">
          <strong id="uName">—</strong>
          <span id="uRole">—</span>
        </div>
        <button class="btn btn-ghost" id="logoutBtn">退出</button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- Toast 容器 -->
<div id="toastBox"></div>

<script>
/* ================================================================
 *  学校多部门协同管理系统 —— 原生 JS 单文件实现
 *  数据存储：localStorage
 * ================================================================ */

/* ----------------------------------------------------------------
 * 1. 常量与数据层
 * ---------------------------------------------------------------- */
const K = {
  ver    : 'sms_data_version',
  orgs   : 'sms_orgs',
  dept   : 'sms_departments',
  users  : 'sms_users',
  tasks  : 'sms_tasks',
  notices: 'sms_notices',
  apps   : 'sms_applications',
  logs   : 'sms_logs',
  cur    : 'sms_current',
  read   : 'sms_read',
  notifs : 'sms_notifications',
  nreads : 'sms_notif_reads',
  cfg    : 'sms_push_config'
};

/* 数据版本号：数值变更时，旧浏览器中的历史数据会自动重建为「初始空库」
 * 版本 3 = 清空演示人员与业务数据（保留组织架构，仅保留 1 个管理员） */
const DATA_VERSION = 3;

/* -------------------- 存储抽象层（带内存降级） -------------------- */
/* 解决浏览器 file:// / 隐身模式 / 安全策略禁用 localStorage 时整个应用崩溃的问题 */
const Store = (function(){
  const mem = {};           // 内存备份字典
  let   mode = null;        // 'local' | 'memory'
  let   checked = false;

  function available(){
    if (checked) return mode === 'local';
    checked = true;
    try {
      const t = '__sms_probe__' + Date.now();
      localStorage.setItem(t, '1');
      localStorage.removeItem(t);
      mode = 'local';
    } catch(e){
      mode = 'memory';
    }
    return mode === 'local';
  }

  return {
    available: available,
    mode: () => mode,
    get(key, def){
      if (available()){
        try {
          const v = localStorage.getItem(key);
          if (v === null || v === undefined) return def;
          return JSON.parse(v);
        } catch(e){ /* 落到内存分支 */ }
      }
      return Object.prototype.hasOwnProperty.call(mem, key) ? mem[key] : def;
    },
    set(key, val){
      const str = JSON.stringify(val);
      if (available()){
        try { localStorage.setItem(key, str); return 'local'; }
        catch(e){ /* 落到内存分支 */ }
      }
      mem[key] = val;
      return 'memory';
    },
    remove(key){
      if (available()){
        try { localStorage.removeItem(key); return; }
        catch(e){ /* 落到内存分支 */ }
      }
      delete mem[key];
    },
    /* 内存模式下的应急：把全部数据以 JSON 字符串形式塞进 cookie / dataURL 备用 */
    snapshot(){
      return JSON.stringify({
        departments: mem.departments,
        users: mem.users,
        tasks: mem.tasks,
        notices: mem.notices,
        applications: mem.applications,
        logs: mem.logs,
        read: mem.read
      });
    }
  };
})();

/* 全局初始化错误展示（万一 JS 抛错，页面也至少能给个提示） */
window.addEventListener('error', function(ev){
  try{
    var box = document.getElementById('initErrorBox');
    if (!box){
      box = document.createElement('div');
      box.id = 'initErrorBox';
      box.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:9999;background:#fee2e2;color:#7f1d1d;padding:12px 14px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.15);max-height:40vh;overflow:auto;';
      document.body.appendChild(box);
    }
    box.innerHTML = '<b>⚠️ 页面初始化出现错误</b><br>' +
      (ev.message || '未知错误') +
      (ev.filename ? '<br><span style="color:#991b1b;">' + ev.filename + ':' + ev.lineno + '</span>' : '');
  }catch(_){}
});

/* 内存中的数据库 */
const DB = {
  organizations: [],
  departments: [],
  users: [],
  tasks: [],
  notices: [],
  applications: [],
  logs: [],
  notifications: [],   /* 站内通知 */
  notifReads: {},      /* 用户 → 已读时间戳 */
  pushCfg: {}          /* 推送配置：serverchanKey / ntfyTopic / desktop */
};

let currentUser = null;   // 当前登录用户对象
let modalEl = null;       // 当前弹窗 DOM
let storageMode = null;   // 'local' / 'memory' —— 当前数据保存模式

/* -------------------- 通用工具 -------------------- */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function nowISO(){ return new Date().toISOString(); }

/** HTML 转义，防止 XSS */
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/** 时间格式化 */
function fmt(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  if(isNaN(d.getTime())) return String(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/** 把 Date 转成 datetime-local 需要的格式 */
function toLocalInput(ts){
  const d = new Date(ts);
  if(isNaN(d.getTime())) return '';
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

/** 未来 N 天的时间（datetime-local 格式） */
function futureDate(days, hour){
  const d = new Date();
  d.setDate(d.getDate() + days);
  d.setHours(hour === undefined ? 18 : hour, 0, 0, 0);
  return toLocalInput(d);
}

/** 安全读取数据（localStorage 不可用时自动降级到内存） */
function loadKey(key, def){
  return Store.get(key, def);
}

/* -------------------- 数据读写 -------------------- */
function loadAll(){
  DB.organizations = loadKey(K.orgs, []);
  DB.departments  = loadKey(K.dept, []);
  DB.users        = loadKey(K.users, []);
  DB.tasks        = loadKey(K.tasks, []);
  DB.notices      = loadKey(K.notices, []);
  DB.applications = loadKey(K.apps, []);
  DB.logs         = loadKey(K.logs, []);
  DB.notifications = loadKey(K.notifs, []);
  DB.notifReads   = loadKey(K.nreads, {});
  DB.pushCfg      = loadKey(K.cfg, {});
}
function saveAll(){
  const mode = Store.set(K.orgs,    DB.organizations);
  Store.set(K.dept,    DB.departments);
  Store.set(K.users,   DB.users);
  Store.set(K.tasks,   DB.tasks);
  Store.set(K.notices, DB.notices);
  Store.set(K.apps,    DB.applications);
  Store.set(K.logs,    DB.logs);
  Store.set(K.notifs,  DB.notifications);
  Store.set(K.nreads,  DB.notifReads);
  Store.set(K.cfg,     DB.pushCfg);
  storageMode = mode;
}

/* -------------------- 完整演示数据（仅用于「恢复演示数据」按钮，非默认初始化） --------------------
 * 默认初始化不再使用本函数，系统首次打开为「空库」状态：保留组织架构，只留 1 个管理员。 */
function seedDemoData(){
  const t = nowISO();

  /* 一级：机构分类 */
  DB.organizations = [
    {id:'o1', name:'书院直属机构', desc:'书院党委与团委直属的学生组织', createdAt:t},
    {id:'o2', name:'第一社区',     desc:'第一社区团委、学生会与学生服务中心', createdAt:t},
    {id:'o3', name:'第二社区',     desc:'第二社区团委、学生会与学生服务中心', createdAt:t},
    {id:'o4', name:'班级层面',     desc:'各班级团支部与班委会', createdAt:t}
  ];

  /* 二级：部门 / 组织 */
  DB.departments = [
    /* 书院直属机构 */

/* -------------------- 数据便捷读取 -------------------- */
const getOrg     = id => DB.organizations.find(o => o.id === id);
const getDept    = id => DB.departments.find(d => d.id === id);
const getUser    = id => DB.users.find(u => u.id === id);
const deptName   = id => { const d = getDept(id); return d ? d.name : '—'; };
const userName   = id => { const u = getUser(id); return u ? u.name : '—'; };
const orgName    = id => { const o = getOrg(id); return o ? o.name : '未分类'; };

/* 部门所属机构名 */
function deptOrgName(deptId){
  const d = getDept(deptId);
  return d ? orgName(d.orgId) : '—';
}

/* -------------------- 职级体系 -------------------- */
/* chief 正职（主任/部长/团长/队长）· deputy 副职（副主任/副部长/副队长）· member 干事/队员 */
const RANKS = {
  chief : { label:'正职',      badge:'badge-blue',   short:'正' },
  deputy: { label:'副职',      badge:'badge-orange', short:'副' },
  member: { label:'干事/队员', badge:'badge-gray',   short:'员' }
};
function rankLabel(r){ return (RANKS[r] || RANKS.member).label; }
function rankBadge(r){
  const x = RANKS[r] || RANKS.member;
  return `<span class="badge ${x.badge}">${x.label}</span>`;
}
/* 人员的完整称谓：姓名（岗位） */
function userTitle(u){
  if(!u) return '—';
  if(u.role === 'admin') return '辅导员 / 管理员';
  return u.title ? esc(u.title) : rankLabel(u.rank);
}
/* 是否可管理本部门（发布任务、查看部门进度、催办） */
function canManageDept(u){
  if(!u) return false;
  return u.role === 'admin' || u.rank === 'chief';
}

/* -------------------- 超级管理员（最高管理员） --------------------
 * 系统内最高权限：可一键批量导入人员、可授予/收回他人的超级管理员身份。
 * 超级管理员账号不可被删除、不可被禁用。 */
function isSuperAdmin(u){
  return !!u && u.role === 'admin' && u.isSuper === true;
}
/* 超级管理员数量 */
function superAdminCount(){
  return DB.users.filter(u => u.role === 'admin' && u.isSuper === true).length;
}
/* 兼容旧数据：确保系统内至少存在一个超级管理员（不清空任何业务数据） */
function ensureSuperAdmin(){
  if(DB.users.some(u => u.role === 'admin' && u.isSuper === true)) return false;
  const first = DB.users.find(u => u.role === 'admin');
  if(first){ first.isSuper = true; return true; }
  return false;
}
/* 是否可查看本部门整体进度（正职 + 副职） */
function canViewDeptProgress(u){
  if(!u) return false;
  return u.role === 'admin' || u.rank === 'chief' || u.rank === 'deputy';
}
/* 我管理的部门列表（正职管理自己所在部门） */
function myDept(){
  if(!currentUser || !currentUser.departmentId) return null;
  return getDept(currentUser.departmentId);
}
/* 本部门成员 */
function deptMembers(deptId){
  return DB.users.filter(u => u.departmentId === deptId);
}
/* 本部门任务（部门任务 + 该部门成员收到的个人任务） */
function deptTasks(deptId){
  return DB.tasks.filter(t => {
    if(t.targetType === 'dept') return t.targetId === deptId;
    const u = getUser(t.targetId);
    return u && u.departmentId === deptId;
  });
}

/* 公告排序：置顶优先，其次按时间倒序 */
function noticeSort(a, b){
  if(!!b.top !== !!a.top) return (b.top ? 1 : 0) - (a.top ? 1 : 0);
  return new Date(b.createdAt) - new Date(a.createdAt);
}

/* 任务状态 / 优先级徽章 */
const TASK_STATUS = { pending:'未开始', doing:'进行中', done:'已完成', reviewed:'已审核' };
function statusBadge(s){
  const map = { pending:'badge-gray', doing:'badge-blue', done:'badge-orange', reviewed:'badge-green' };
  return `<span class="badge ${map[s] || 'badge-gray'}">${TASK_STATUS[s] || esc(s)}</span>`;
}
function priorityBadge(p){
  const map = { '高':'badge-red', '中':'badge-orange', '低':'badge-blue' };
  return `<span class="badge ${map[p] || 'badge-gray'}">${esc(p)}</span>`;
}
function appStatusBadge(s){
  const map = { pending:'badge-orange', approved:'badge-green', rejected:'badge-red' };
  const txt = { pending:'待审批', approved:'已通过', rejected:'已驳回' };
  return `<span class="badge ${map[s] || 'badge-gray'}">${txt[s] || esc(s)}</span>`;
}
function targetText(t){
  if(t.targetType === 'dept') return '部门：' + deptName(t.targetId);
  const u = getUser(t.targetId);
  return '人员：' + userName(t.targetId) + (u && u.title ? '（' + u.title + '）' : '');
}
function isOverdue(t){
  return t.deadline && new Date(t.deadline) < new Date() && t.status !== 'done' && t.status !== 'reviewed';
}

/* 部门人员可见任务：发给本部门的 or 发给自己的 */
function visibleTasks(u){
  return DB.tasks.filter(t => {
    if(t.targetType === 'user') return t.targetId === u.id;
    return t.targetId === u.departmentId;
  });
}

/* -------------------- 已读公告 -------------------- */
function getReadMap(){ return loadKey(K.read, {}); }
function markRead(userId, noticeId){
  const m = getReadMap();
  m[userId] = m[userId] || [];
  if(!m[userId].includes(noticeId)){
    m[userId].push(noticeId);
    Store.set(K.read, m);
  }
}
function unreadNotices(user){
  const list = getReadMap()[user.id] || [];
  return DB.notices.filter(n => !list.includes(n.id));
}

/* -------------------- 日志 -------------------- */
function addLog(userId, action){
  DB.logs.push({ id: uid('l'), userId, action, createdAt: nowISO() });
  if(DB.logs.length > 300) DB.logs = DB.logs.slice(-300);
  saveAll();
}

/* ----------------------------------------------------------------
 * 2. Toast / Modal 通用组件
 * ---------------------------------------------------------------- */
function toast(msg, type){
  const box = document.getElementById('toastBox');
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'success');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 320);
  }, 2200);
}

/**
 * 打开弹窗
 * @param {string} title 标题
 * @param {string} bodyHTML 内容
 * @param {function|null} onOk 点击确定回调，返回 false 则不关闭
 * @param {string} okText 确定按钮文字
 */
function openModal(title, bodyHTML, onOk, okText){
  closeModal();
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `
    <div class="modal">
      <div class="modal-head">
        <h3>${esc(title)}</h3>
        <button class="modal-close" type="button">✕</button>
      </div>
      <div class="modal-body">${bodyHTML}</div>
      <div class="modal-foot">
        <button class="btn btn-ghost cancel" type="button">取消</button>
        <button class="btn btn-primary ok" type="button">${esc(okText || '确定')}</button>
      </div>
    </div>`;
  document.body.appendChild(mask);
  modalEl = mask;

  mask.querySelector('.modal-close').onclick = closeModal;
  mask.querySelector('.cancel').onclick = closeModal;
  mask.querySelector('.ok').onclick = function(){
    if(onOk && onOk(mask) === false) return;
    closeModal();
  };
  mask.addEventListener('click', e => { if(e.target === mask) closeModal(); });

  const first = mask.querySelector('input,select,textarea');
  if(first) setTimeout(() => first.focus(), 60);
  return mask;
}
function closeModal(){
  if(modalEl){ modalEl.remove(); modalEl = null; }
}

/** 二次确认弹窗 */
function confirmModal(msg, onOk, okText){
  openModal('操作确认', `<p style="padding:6px 0;">${esc(msg)}</p>`, () => { onOk(); }, okText || '确认删除');
  const ok = modalEl.querySelector('.ok');
  ok.className = 'btn btn-danger';
}

/* 按当前用户过滤菜单：superOnly 项仅超级管理员可见 */
function getMenuFor(u){
  const base = (u && u.role === 'admin') ? ADMIN_MENU : getStaffMenu(u);
  return base.filter(m => !m.superOnly || isSuperAdmin(u));
}
/* 部门人员菜单：按职级动态生成 */
function getStaffMenu(u){
  const isChief = u && u.rank === 'chief';
  return [
    { key:'mywork',    icon:'🏠', label:'我的工作台' },
    { key:'mydept',    icon:'🏢', label: isChief ? '部门管理' : (u && u.rank === 'deputy' ? '部门概况' : '部门信息') },
    { key:'mytasks',   icon:'📋', label:'任务中心' },
    { key:'mynotices', icon:'📢', label:'通知公告' },
    { key:'myapps',    icon:'📝', label:'我的申请' },
    { key:'profile',   icon:'👤', label:'个人中心' }
  ];
}

/** 路由分发 */
function route(){
  const raw = location.hash.replace(/^#\/?/, '');

  /* 未登录 —— 强制回登录页 */
  if(!currentUser){
    if(raw !== 'login') history.replaceState(null, '', '#/login');
    document.getElementById('appPage').classList.add('hidden');
    document.getElementById('loginPage').classList.remove('hidden');
    return;
  }

  const menu = getMenuFor(currentUser);
  const allowed = menu.map(m => m.key);
  const def = currentUser.role === 'admin' ? 'dashboard' : 'mywork';
  let key = allowed.includes(raw) ? raw : def;

  /* 越权访问：自动跳回自己的首页 */
  if(key !== raw) history.replaceState(null, '', '#/' + key);

  showApp(menu, key);
}

/** 渲染主框架 + 页面内容 */
function showApp(menu, key){
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('appPage').classList.remove('hidden');

  /* 侧边菜单 */
  document.getElementById('menu').innerHTML = menu.map(m =>
    `<a class="menu-item ${m.key === key ? 'active' : ''}" href="#/${m.key}">
       <span class="ic">${m.icon}</span>${m.label}
     </a>`).join('');

  /* 顶部栏 */
  const u = currentUser;
  document.getElementById('uName').textContent = u.name;
  document.getElementById('uRole').textContent =
    u.role === 'admin'
      ? (isSuperAdmin(u) ? '⭐ 超级管理员' : '辅导员 / 管理员')
      : (deptName(u.departmentId) + ' · ' + (u.title || rankLabel(u.rank)));
  document.getElementById('pageTitle').textContent =
    (menu.find(m => m.key === key) || {}).label || '';

  /* 通知红点 */
  renderBell();

  /* 内容区 */
  const content = document.getElementById('content');
  content.innerHTML = '';
  const render = PAGES[key];
  if(render) render(content);
  content.scrollTop = 0;

  /* 关闭移动端侧栏 */
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

/** 数据变更后刷新当前页面 */
function refresh(){ route(); }

function openOrgModal(o){

    <div class="field"><label>机构名称 <i>*</i></label>

    const desc = modalEl.querySelector('#o_desc').value.trim();

    if(DB.organizations.some(x => x.name === name && (!o || x.id !== o.id))){
      toast('机构名称已存在', 'error'); return false;

    if(o){
      Object.assign(o, { name, desc });

      toast('机构添加成功');
      addLog(currentUser.id, '新增机构：' + name);
    }
    saveAll();
    refresh();
  }, '保存');
}

/** 删除机构 */
function delOrg(id){
  const o = getOrg(id);
  if(!o) return;
  const depts = DB.departments.filter(d => d.orgId === id);
  if(depts.length){
    toast(`该机构下还有 ${depts.length} 个部门，请先删除或转移部门`, 'error');
    return;
  }
  confirmModal(`确定要删除机构「${o.name}」吗？删除后不可恢复。`, () => {
    DB.organizations = DB.organizations.filter(x => x.id !== id);
    saveAll();
    addLog(currentUser.id, '删除机构：' + o.name);
    toast('机构已删除');
    refresh();
  });
}

    if(!name){ toast('请填写部门名称', 'error'); return false; }
    if(DB.departments.some(x => x.name === name && (!d || x.id !== d.id))){
      toast('部门名称已存在', 'error'); return false;
    }

    if(d){
      Object.assign(d, { orgId, name, desc, leader, phone });
      toast('部门信息已更新');
      addLog(currentUser.id, '编辑部门：' + name);
    }else{
      DB.departments.push({ id: uid('d'), orgId, name, desc, leader, phone, createdAt: nowISO() });
      toast('部门添加成功');
      addLog(currentUser.id, '新增部门：' + name);
    }
    saveAll();
    refresh();
  }, '保存');
}

/** 删除部门 */
function delDept(id){
  const d = getDept(id);
  if(!d) return;
  const members = DB.users.filter(u => u.departmentId === id).length;
  if(members > 0){
    toast(`该部门下还有 ${members} 名人员，请先转移人员后再删除`, 'error');
    return;
  }
  confirmModal(`确定要删除部门「${d.name}」吗？删除后不可恢复。`, () => {
    DB.departments = DB.departments.filter(x => x.id !== id);
    saveAll();
    addLog(currentUser.id, '删除部门：' + d.name);
    toast('部门已删除');
    refresh();
  });
}

/* ============================================================
 * 4.3 管理员 —— 人员管理
 * ============================================================ */
function pageUsers(el){
  let filterOrg  = 'all';
  let filterDept = 'all';
  let filterRank = 'all';

  el.innerHTML = `
    <section class="card">
      <div class="card-head">
        <h3>人员列表（共 ${DB.users.length} 人）</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <select id="orgFilter" style="padding:8px 12px;border:1px solid var(--border);border-radius:8px;">
            <option value="all">全部机构</option>
            ${DB.organizations.map(o => `<option value="${o.id}">${esc(o.name)}</option>`).join('')}
          </select>
          <select id="deptFilter" style="padding:8px 12px;border:1px solid var(--border);border-radius:8px;">
            <option value="all">全部部门</option>
          </select>
          <select id="rankFilter" style="padding:8px 12px;border:1px solid var(--border);border-radius:8px;">
            <option value="all">全部职级</option>
            <option value="chief">正职（主任/部长/团长）</option>
            <option value="deputy">副职（副主任/副部长）</option>
            <option value="member">干事 / 队员</option>
            <option value="admin">管理员</option>
          </select>
          <button class="btn btn-primary" id="addUserBtn">＋ 新增人员</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>账号</th><th>姓名</th><th>岗位</th><th>职级</th><th>所属机构</th><th>所属部门</th><th>电话</th><th>状态</th><th>操作</th></tr>
          </thead>
          <tbody id="userBody"></tbody>
        </table>
      </div>
    </section>`;

  const body = $('#userBody', el);
  const deptSel = $('#deptFilter', el);

  /* 机构 → 部门 联动筛选 */
  function fillDeptOptions(){
    const list = filterOrg === 'all' ? DB.departments : DB.departments.filter(d => d.orgId === filterOrg);
    deptSel.innerHTML = '<option value="all">全部部门</option>' +
      list.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('');
    deptSel.value = 'all';
    filterDept = 'all';
  }

  function renderRows(){
    let list = DB.users;
    if(filterOrg !== 'all'){
      list = list.filter(u => { const d = getDept(u.departmentId); return d && d.orgId === filterOrg; });
    }
    if(filterDept !== 'all') list = list.filter(u => u.departmentId === filterDept);
    if(filterRank !== 'all'){
      list = filterRank === 'admin'
        ? list.filter(u => u.role === 'admin')
        : list.filter(u => u.role === 'staff' && u.rank === filterRank);
    }

    if(!list.length){
      body.innerHTML = '<tr><td colspan="9" class="muted">暂无人员数据</td></tr>';
      return;
    }
    const iAmSuper = isSuperAdmin(currentUser);
    body.innerHTML = list.map(u => {
      const sup = isSuperAdmin(u);
      const canGrant = iAmSuper && u.role === 'admin' && u.id !== currentUser.id;
      return `
      <tr>
        <td>${esc(u.username)}</td>
        <td><strong>${esc(u.name)}</strong>${sup ? ' <span class="badge badge-orange">⭐ 超级管理员</span>' : ''}</td>
        <td>${u.role === 'admin' ? (sup ? '系统最高管理员' : '辅导员') : esc(u.title || rankLabel(u.rank))}</td>
        <td>${u.role === 'admin' ? '—' : rankBadge(u.rank)}</td>
        <td>${u.role === 'admin' ? '—' : esc(deptOrgName(u.departmentId))}</td>
        <td>${u.role === 'admin' ? '—' : esc(deptName(u.departmentId))}</td>
        <td>${esc(u.phone || '—')}</td>
        <td>${u.status === 1 ? '<span class="badge badge-green">启用</span>' : '<span class="badge badge-red">禁用</span>'}</td>
        <td>
          <div class="ops">
            <button class="btn btn-sm btn-warn" data-edit="${u.id}">编辑</button>
            <button class="btn btn-sm" data-reset="${u.id}">重置密码</button>
            ${canGrant ? `<button class="btn btn-sm ${sup ? 'btn-ghost' : 'btn-success'}" data-super="${u.id}">${sup ? '取消超管' : '设为超管'}</button>` : ''}
            ${sup ? '' : `<button class="btn btn-sm ${u.status === 1 ? 'btn-danger' : 'btn-success'}" data-toggle="${u.id}">${u.status === 1 ? '禁用' : '启用'}</button>`}
            ${sup ? '' : `<button class="btn btn-sm btn-danger" data-del="${u.id}">删除</button>`}
          </div>
        </td>
      </tr>`;
    }).join('');

    body.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openUserModal(getUser(b.dataset.edit)));
    body.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => resetPwd(b.dataset.reset));
    body.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => toggleUser(b.dataset.toggle));
    body.querySelectorAll('[data-del]').forEach(b => b.onclick = () => delUser(b.dataset.del));
    body.querySelectorAll('[data-super]').forEach(b => b.onclick = () => toggleSuper(b.dataset.super));
  }

  $('#orgFilter', el).onchange = e => { filterOrg = e.target.value; fillDeptOptions(); renderRows(); };
  deptSel.onchange = e => { filterDept = e.target.value; renderRows(); };
  $('#rankFilter', el).onchange = e => { filterRank = e.target.value; renderRows(); };
  $('#addUserBtn', el).onclick = () => openUserModal(null);

  fillDeptOptions();
  renderRows();
}

/** 人员新增 / 编辑弹窗（支持机构 → 部门 → 职级 → 岗位 归类） */
function openUserModal(u){
  const isEdit = !!u;
  const curOrg = u && u.departmentId ? (getDept(u.departmentId) || {}).orgId : (DB.organizations[0] || {}).id;

  openModal(isEdit ? '编辑人员' : '新增人员', `
    <div class="field"><label>账号 <i>*</i></label>
      <input id="u_username" value="${esc(u ? u.username : '')}" ${isEdit ? 'readonly' : ''} placeholder="登录账号（建议用拼音缩写，如 sq1tw01）"></div>
    ${isEdit ? '' : '<div class="field"><label>密码 <i>*</i></label><input id="u_password" value="123456" placeholder="登录密码"></div>'}
    <div class="field"><label>姓名 <i>*</i></label>
      <input id="u_name" value="${esc(u ? u.name : '')}" placeholder="真实姓名"></div>
    <div class="field"><label>角色 <i>*</i></label>
      <select id="u_role">
        <option value="staff" ${u && u.role === 'staff' ? 'selected' : ''}>部门人员（学生干部）</option>
        <option value="admin" ${u && u.role === 'admin' ? 'selected' : ''}>辅导员 / 管理员</option>
      </select></div>
    <div class="field"><label>所属机构 <i>*</i></label>
      <select id="u_org">
        ${DB.organizations.map(o => `<option value="${o.id}" ${curOrg === o.id ? 'selected' : ''}>${esc(o.name)}</option>`).join('')}
      </select></div>
    <div class="field"><label>所属部门 <i>*</i></label>
      <select id="u_dept"></select></div>
    <div class="field" id="u_rankWrap"><label>职级 <i>*</i></label>
      <select id="u_rank">
        <option value="chief"  ${u && u.rank === 'chief' ? 'selected' : ''}>正职（主任 / 部长 / 团长 / 队长）</option>
        <option value="deputy" ${u && u.rank === 'deputy' ? 'selected' : ''}>副职（副主任 / 副部长 / 副队长）</option>
        <option value="member" ${!u || u.rank === 'member' ? 'selected' : ''}>干事 / 队员</option>
      </select></div>
    <div class="field" id="u_titleWrap"><label>岗位名称</label>
      <input id="u_title" value="${esc(u ? (u.title || '') : '')}" placeholder="如：组织部部长、团委副书记、干事"></div>
    <div class="field"><label>电话</label>
      <input id="u_phone" value="${esc(u ? u.phone : '')}" placeholder="联系电话"></div>
    <div class="field"><label>状态</label>
      <select id="u_status">
        <option value="1" ${!u || u.status === 1 ? 'selected' : ''}>启用</option>
        <option value="0" ${u && u.status === 0 ? 'selected' : ''}>禁用</option>
      </select></div>
  `, () => {
    const username = modalEl.querySelector('#u_username').value.trim();
    const name     = modalEl.querySelector('#u_name').value.trim();
    const role     = modalEl.querySelector('#u_role').value;
    const orgId    = modalEl.querySelector('#u_org').value;
    const deptId   = modalEl.querySelector('#u_dept').value;
    const rank     = modalEl.querySelector('#u_rank').value;
    const title    = modalEl.querySelector('#u_title').value.trim();
    const phone    = modalEl.querySelector('#u_phone').value.trim();
    const status   = Number(modalEl.querySelector('#u_status').value);

    if(!username){ toast('请填写账号', 'error'); return false; }
    if(!name){ toast('请填写姓名', 'error'); return false; }
    if(role === 'staff' && !deptId){ toast('部门人员必须选择所属部门', 'error'); return false; }

    if(!isEdit){
      const pwd = modalEl.querySelector('#u_password').value.trim();
      if(!pwd){ toast('请填写密码', 'error'); return false; }
      if(DB.users.some(x => x.username === username)){ toast('该账号已存在', 'error'); return false; }
      DB.users.push({
        id: uid('u'), username, password: pwd, role, name,
        rank: role === 'admin' ? '' : rank,
        title: role === 'admin' ? '辅导员' : title,
        departmentId: role === 'admin' ? '' : deptId,
        phone, status, createdAt: nowISO()
      });
      toast('人员添加成功：' + name + '（' + deptName(deptId) + ' · ' + rankLabel(rank) + '）');
      addLog(currentUser.id, '新增人员：' + name + ' → ' + deptName(deptId));
    }else{
      if(u.id === currentUser.id && status === 0){
        toast('不能禁用当前登录账号', 'error'); return false;
      }
      Object.assign(u, {
        name, role,
        rank: role === 'admin' ? '' : rank,
        title: role === 'admin' ? '辅导员' : title,
        departmentId: role === 'admin' ? '' : deptId,
        phone, status
      });
      toast('人员信息已更新');
      addLog(currentUser.id, '编辑人员：' + name);
    }
    saveAll();
    refresh();
  }, '保存');

  /* 机构 → 部门联动 + 角色切换隐藏职级 */
  const orgSel   = modalEl.querySelector('#u_org');
  const deptS    = modalEl.querySelector('#u_dept');
  const roleSel  = modalEl.querySelector('#u_role');
  const rankWrap = modalEl.querySelector('#u_rankWrap');
  const titleWrap= modalEl.querySelector('#u_titleWrap');

  function fillDepts(){
    const list = DB.departments.filter(d => d.orgId === orgSel.value);
    deptS.innerHTML = list.length
      ? list.map(d => `<option value="${d.id}" ${u && u.departmentId === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')
      : '<option value="">该机构下暂无部门</option>';
  }
  orgSel.onchange = fillDepts;
  fillDepts();

  function syncRole(){
    const isStaff = roleSel.value === 'staff';
    rankWrap.style.display  = isStaff ? 'block' : 'none';
    titleWrap.style.display = isStaff ? 'block' : 'none';
  }
  roleSel.onchange = syncRole;
  syncRole();
}

/** 重置密码 */
function resetPwd(id){
  const u = getUser(id);
  if(!u) return;
  confirmModal(`确定将「${u.name}」的密码重置为 123456 吗？`, () => {
    u.password = '123456';
    saveAll();
    addLog(currentUser.id, '重置密码：' + u.name);
    toast('密码已重置为 123456');
  }, '确认重置');
}

/** 启用 / 禁用 */
function toggleUser(id){
  const u = getUser(id);
  if(!u) return;
  if(u.id === currentUser.id){ toast('不能操作当前登录账号', 'error'); return; }
  if(isSuperAdmin(u)){ toast('超级管理员账号不可禁用，请先取消其超级管理员身份', 'error'); return; }
  u.status = u.status === 1 ? 0 : 1;
  saveAll();
  addLog(currentUser.id, (u.status === 1 ? '启用' : '禁用') + '账号：' + u.name);
  toast(u.status === 1 ? '已启用该账号' : '已禁用该账号');
  refresh();
}

/** 删除人员 */
function delUser(id){
  const u = getUser(id);
  if(!u) return;
  if(u.id === currentUser.id){ toast('不能删除当前登录账号', 'error'); return; }
  if(isSuperAdmin(u)){ toast('超级管理员账号不可删除，请先取消其超级管理员身份', 'error'); return; }
  confirmModal(`确定删除人员「${u.name}（${u.username}）」吗？删除后不可恢复。`, () => {
    DB.users = DB.users.filter(x => x.id !== id);
    saveAll();
    addLog(currentUser.id, '删除人员：' + u.name);
    toast('人员已删除');
    refresh();
  });
}

/** 授予 / 取消超级管理员（仅超级管理员本人可操作） */
function toggleSuper(id){
  if(!isSuperAdmin(currentUser)){ toast('仅超级管理员可执行此操作', 'error'); return; }
  const u = getUser(id);
  if(!u || u.role !== 'admin'){ toast('该账号不是管理员', 'error'); return; }
  if(u.id === currentUser.id){ toast('不能修改自己的超级管理员身份', 'error'); return; }
  if(u.isSuper && superAdminCount() <= 1){ toast('系统至少需要保留 1 个超级管理员', 'error'); return; }

  const toSuper = !u.isSuper;
  confirmModal(
    toSuper
      ? `确定将「${u.name}」设为超级管理员吗？该账号将获得批量导入人员等最高权限。`
      : `确定取消「${u.name}」的超级管理员身份吗？`,
    () => {
      u.isSuper = toSuper;
      saveAll();
      addLog(currentUser.id, (toSuper ? '授予超级管理员：' : '取消超级管理员：') + u.name);
      toast(toSuper ? '已授予超级管理员权限' : '已取消超级管理员权限');
      refresh();
    }, toSuper ? '确认授予' : '确认取消');
}

            <button class="btn btn-sm btn-danger" data-del="${t.id}">删除</button>
          </div>
        </td>
      </tr>`).join('');

    body.querySelectorAll('[data-view]').forEach(b => b.onclick = () => viewTask(b.dataset.view));

}

/** 任务新增 / 编辑弹窗 */
function openTaskModal(t){
  const isEdit = !!t;
  openModal(isEdit ? '编辑任务' : '发布任务', `
    <div class="field"><label>任务标题 <i>*</i></label>
      <input id="t_title" value="${esc(t ? t.title : '')}" placeholder="请输入任务标题"></div>
    <div class="field"><label>任务内容</label>
      <textarea id="t_content" rows="3" placeholder="请输入任务详细内容">${esc(t ? t.content : '')}</textarea></div>
    <div class="field"><label>目标类型 <i>*</i></label>
      <select id="t_type">
        <option value="dept" ${t && t.targetType === 'dept' ? 'selected' : ''}>发给某个部门</option>
        <option value="user" ${t && t.targetType === 'user' ? 'selected' : ''}>发给某个人员</option>
      </select></div>
    <div class="field"><label>目标对象 <i>*</i></label>
      <select id="t_target"></select></div>
    <div class="field"><label>优先级</label>
      <select id="t_priority">
        ${['高','中','低'].map(p => `<option value="${p}" ${t && t.priority === p ? 'selected' : ''}>${p}</option>`).join('')}
      </select></div>
    <div class="field"><label>截止时间 <i>*</i></label>
      <input type="datetime-local" id="t_deadline" value="${t && t.deadline ? toLocalInput(t.deadline) : ''}"></div>
  `, () => {
    const title     = modalEl.querySelector('#t_title').value.trim();
    const content   = modalEl.querySelector('#t_content').value.trim();
    const targetType= modalEl.querySelector('#t_type').value;
    const targetId  = modalEl.querySelector('#t_target').value;
    const priority  = modalEl.querySelector('#t_priority').value;
    const deadline  = modalEl.querySelector('#t_deadline').value;

    if(!title){ toast('请填写任务标题', 'error'); return false; }
    if(!targetId){ toast('请选择目标对象', 'error'); return false; }
    if(!deadline){ toast('请选择截止时间', 'error'); return false; }

    if(isEdit){
      Object.assign(t, { title, content, targetType, targetId, priority, deadline });
      toast('任务已更新');
      addLog(currentUser.id, '编辑任务：' + title);
    }else{
      DB.tasks.push({
        id: uid('t'), title, content, targetType, targetId, priority, deadline,
        status: 'pending', creatorId: currentUser.id, createdAt: nowISO(),
        submitContent: '', reviewRemark: ''
      });
      toast('任务发布成功');
      addLog(currentUser.id, '发布任务：' + title);
      const newTask = DB.tasks[DB.tasks.length - 1];
      pushNotify('📋 新任务：' + title,
        '优先级：' + priority + '　截止：' + fmt(deadline) + '\n发布人：' + currentUser.name +
        (content ? '\n' + content.slice(0, 100) : ''),
        taskTargetUserIds(newTask));
    }
    saveAll();
    refresh();
  }, '保存');

  /* 目标对象联动 */
  const typeSel   = modalEl.querySelector('#t_type');
  const targetSel = modalEl.querySelector('#t_target');

  function fillTargets(){
    let html = '';
    if(typeSel.value === 'dept'){
      /* 按机构分组 */
      const groups = DB.organizations.map(o => {
        const ds = DB.departments.filter(d => d.orgId === o.id);
        if(!ds.length) return '';
        return `<optgroup label="${esc(o.name)}">${
          ds.map(d => `<option value="${d.id}" ${t && t.targetId === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')
        }</optgroup>`;
      }).join('');
      /* 未归类部门 */
      const orphan = DB.departments.filter(d => !getOrg(d.orgId));
      html = groups + (orphan.length
        ? `<optgroup label="未归类">${orphan.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('')}</optgroup>`
        : '');
    }else{
      /* 按机构 → 部门分组列出人员 */
      const groups = DB.organizations.map(o => {
        const ds = DB.departments.filter(d => d.orgId === o.id);
        const us = DB.users.filter(u => u.status === 1 && ds.some(d => d.id === u.departmentId));
        if(!us.length) return '';
        return `<optgroup label="${esc(o.name)}">${
          us.map(u => `<option value="${u.id}" ${t && t.targetId === u.id ? 'selected' : ''}>${esc(u.name)}（${esc(u.title || rankLabel(u.rank))} · ${esc(deptName(u.departmentId))}）</option>`).join('')
        }</optgroup>`;
      }).join('');
      /* 管理员等无部门人员 */
      const admins = DB.users.filter(u => u.status === 1 && !u.departmentId);
      html = groups + (admins.length
        ? `<optgroup label="书院管理人员">${admins.map(u => `<option value="${u.id}" ${t && t.targetId === u.id ? 'selected' : ''}>${esc(u.name)}（${esc(u.title || '管理员')}）</option>`).join('')}</optgroup>`
        : '');
    }
    targetSel.innerHTML = html || '<option value="">暂无可选对象</option>';
  }
  typeSel.onchange = fillTargets;
  fillTargets();
}

/** 查看 / 审核任务 */
function viewTask(id){
  const t = DB.tasks.find(x => x.id === id);
  if(!t) return;

  const body = `
    <div class="detail">
      <p><b>任务标题：</b>${esc(t.title)}</p>
      <p><b>任务内容：</b>${esc(t.content || '—')}</p>
      <p><b>目标对象：</b>${esc(targetText(t))}</p>
      <p><b>优先级：</b>${esc(t.priority)}</p>
      <p><b>截止时间：</b>${fmt(t.deadline)}</p>
      <p><b>当前状态：</b>${statusBadge(t.status)}</p>
      <p><b>创建人：</b>${esc(userName(t.creatorId))} · ${fmt(t.createdAt)}</p>
      ${t.submitContent ? `<p><b>完成说明：</b>${esc(t.submitContent)}</p>` : ''}
      ${t.reviewRemark ? `<p><b>审核意见：</b>${esc(t.reviewRemark)}</p>` : ''}
    </div>
    ${t.status === 'done' ? `<div class="field" style="margin-top:12px;"><label>审核意见</label>
      <textarea id="rv_remark" rows="2" placeholder="可填写审核意见（选填）"></textarea></div>` : ''}`;

  openModal('任务详情', body, null, '关闭');

  const okBtn = modalEl.querySelector('.ok');
  const cancelBtn = modalEl.querySelector('.cancel');

  if(t.status === 'done'){
    /* 通过 */
    okBtn.className = 'btn btn-success';
    okBtn.textContent = '审核通过';
    okBtn.onclick = () => {
      t.status = 'reviewed';
      t.reviewRemark = (modalEl.querySelector('#rv_remark') || {}).value || '';
      t.reviewerId = currentUser.id;
      saveAll();
      addLog(currentUser.id, '审核通过任务：' + t.title);
      pushNotify('✅ 任务已审核通过：' + t.title,
        '审核人：' + currentUser.name + (t.reviewRemark ? '\n审核意见：' + t.reviewRemark : ''),
        taskTargetUserIds(t));
      toast('任务已审核通过');
      closeModal();
      refresh();
    };
    /* 驳回 */
    cancelBtn.className = 'btn btn-danger';
    cancelBtn.textContent = '驳回';
    cancelBtn.onclick = () => {
      t.status = 'doing';
      t.reviewRemark = (modalEl.querySelector('#rv_remark') || {}).value || '请重新修改完成说明后再次提交';
      saveAll();
      addLog(currentUser.id, '驳回任务：' + t.title);
      pushNotify('⚠️ 任务被驳回：' + t.title,
        '审核人：' + currentUser.name + '\n意见：' + t.reviewRemark,
        taskTargetUserIds(t));
      toast('已驳回，任务退回「进行中」', 'warn');
      closeModal();
      refresh();
    };
  }else{
    cancelBtn.style.display = 'none';
    okBtn.onclick = closeModal;
  }
}

function pageReports(el){
  /* 按机构统计 */
  const orgRows = DB.organizations.map(o => {
    const depts   = DB.departments.filter(d => d.orgId === o.id);
    const members = DB.users.filter(u => { const d = getDept(u.departmentId); return d && d.orgId === o.id; });
    const tasks   = DB.tasks.filter(t => {
      if(t.targetType === 'dept'){ const d = getDept(t.targetId); return d && d.orgId === o.id; }
      const u = getUser(t.targetId);
      if(!u) return false;
      const d = getDept(u.departmentId);
      return d && d.orgId === o.id;
    });
    const done = tasks.filter(t => t.status === 'done' || t.status === 'reviewed').length;
    return { o, deptCnt: depts.length, memberCnt: members.length,
             chief: members.filter(u => u.rank === 'chief').length,
             total: tasks.length, done,
             rate: tasks.length ? Math.round(done / tasks.length * 100) : 0 };
  });

  /* 按部门统计任务（部门任务 + 该部门人员收到的任务） */
  const rows = DB.departments.map(d => {
    const members = DB.users.filter(u => u.departmentId === d.id).length;
    const tasks = deptTasks(d.id);
    const done = tasks.filter(t => t.status === 'done' || t.status === 'reviewed').length;
    const rate = tasks.length ? Math.round(done / tasks.length * 100) : 0;
    return { d, members, total: tasks.length, done, rate };
  });

  const maxMembers = Math.max(1, ...rows.map(r => r.members));
  const totalUsers = DB.users.length;
  const totalTasks = DB.tasks.length;
  const totalDone  = DB.tasks.filter(t => t.status === 'done' || t.status === 'reviewed').length;
  const staffCnt   = DB.users.filter(u => u.role === 'staff').length;

  el.innerHTML = `
    <div class="stat-grid">
      ${statCard('🏛️', '机构数量', DB.organizations.length, '#7c3aed')}
      ${statCard('🏢', '部门数量', DB.departments.length, '#2563eb')}
      ${statCard('👥', '学生干部', staffCnt, '#0891b2')}
      ${statCard('✅', '整体完成率', (totalTasks ? Math.round(totalDone / totalTasks * 100) : 0) + '%', '#16a34a')}
    </div>

    <section class="card">
      <div class="card-head"><h3>各机构学生干部与任务统计</h3></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>机构名称</th><th>下属部门</th><th>干部人数</th><th>正职人数</th><th>任务总数</th><th>已完成</th><th>完成率</th></tr></thead>
          <tbody>
            ${ orgRows.map(r => `
              <tr>
                <td><strong>${esc(r.o.name)}</strong></td>
                <td>${r.deptCnt} 个</td>
                <td>${r.memberCnt} 人</td>
                <td>${r.chief} 人</td>
                <td>${r.total}</td>
                <td>${r.done}</td>
                <td>
                  <div style="display:flex;align-items:center;gap:10px;">
                    <div class="progress" style="flex:1;max-width:200px;"><i style="width:${r.rate}%"></i></div>
                    <span class="muted">${r.rate}%</span>
                  </div>
                </td>
              </tr>`).join('') }
          </tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h3>各部门人员数量统计</h3></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>所属机构</th><th>部门名称</th><th>人员数量</th><th>占比</th></tr></thead>
          <tbody>
            ${ rows.map(r => `
              <tr>
                <td><span class="badge badge-blue">${esc(orgName(r.d.orgId))}</span></td>
                <td><strong>${esc(r.d.name)}</strong></td>
                <td>${r.members} 人</td>
                <td>
                  <div style="display:flex;align-items:center;gap:10px;">
                    <div class="progress" style="flex:1;max-width:260px;">
                      <i style="width:${Math.round(r.members / maxMembers * 100)}%"></i>
                    </div>
                    <span class="muted">${Math.round(r.members / maxMembers * 100)}%</span>
                  </div>
                </td>
              </tr>`).join('') }
          </tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h3>各部门任务数量与完成率</h3></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>所属机构</th><th>部门名称</th><th>任务总数</th><th>已完成</th><th>完成率</th></tr></thead>

                </td>
              </tr>`).join('') }
          </tbody>
        </table>
      </div>

          <p class="muted" style="margin-bottom:14px;">
            发布任务 / 公告、审核与审批结果产生时，自动向相关人员发送通知。
            电脑端弹窗提醒 + 手机端推送，双通道可同时开启。
          </p>

          <div class="detail" style="margin-bottom:16px;">
            <p><b>① 电脑桌面通知</b> —— 浏览器弹窗提醒（页面打开时有效）</p>
          </div>
          <button class="btn btn-primary" id="askNotifBtn" style="margin-bottom:20px;">开启桌面通知授权</button>

          <div class="detail" style="margin-bottom:10px;">
            <p><b>② 手机推送 · Server酱（微信接收）</b></p>
          </div>
          <div class="field">
            <input id="cfg_scKey" value="${esc((DB.pushCfg || {}).serverchanKey || '')}" placeholder="粘贴 Server酱 SendKey（sct.ftqq.com 免费申请）">
          </div>
          <p class="muted" style="font-size:12px;margin:4px 0 10px;">
            微信扫码登录 sct.ftqq.com → 复制 SendKey 粘贴到这里 → 手机微信关注「方糖」服务号即可收消息。
          </p>
          <button class="btn btn-success" id="testScBtn" style="margin-bottom:20px;">发送测试消息到微信</button>

          <div class="detail" style="margin-bottom:10px;">
            <p><b>③ 手机推送 · ntfy（App 接收，免费无注册）</b></p>
          </div>
          <div class="field">
            <input id="cfg_ntfy" value="${esc((DB.pushCfg || {}).ntfyTopic || '')}" placeholder="自定义一个别人猜不到的主题名，如 mingde-notice-x8k2">
          </div>
          <p class="muted" style="font-size:12px;margin:4px 0 10px;">
            手机安装 ntfy App（App Store / 应用商店 / ntfy.sh）→ 订阅上面同一个主题名 → 电脑浏览器也可打开 ntfy.sh/<b>主题名</b> 网页版接收。
          </p>
          <button class="btn btn-success" id="testNtfyBtn" style="margin-bottom:6px;">发送测试消息到 ntfy</button>
          <p class="muted" id="pushSaveTip" style="font-size:12px;margin-top:14px;"></p>
        </div>
      </section>

      <section class="card">
        <div class="card-head"><h3>数据管理</h3></div>
        <div class="card-body">
          <p class="muted" style="margin-bottom:14px;">
            导出数据可用于备份；导入 JSON 会覆盖当前所有数据，请谨慎操作。
          </p>
          <p class="muted" id="storeModeTip" style="margin-bottom:14px;font-size:12.5px;">
            当前存储模式：<b id="storeModeTxt">检测中...</b>
          </p>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <button class="btn btn-danger" id="clearBtn">清空人员与业务数据</button>
            <button class="btn btn-warn" id="resetBtn">恢复完整演示数据</button>
            <button class="btn btn-primary" id="exportBtn">导出数据 JSON</button>
            <button class="btn btn-success" id="importBtn">导入 JSON 数据</button>
            <input type="file" id="importFile" accept=".json,application/json" class="hidden">
          </div>
          <p class="muted" style="margin-top:10px;font-size:12.5px;">
            「清空人员与业务数据」会删除全部部门人员账号、任务、公告、申请与日志，<b>保留组织架构和当前登录的管理员账号</b>。
          </p>
          <p class="muted" style="margin-top:16px;font-size:12.5px;">
            当前数据量：部门 ${DB.departments.length} 个 · 人员 ${DB.users.length} 人 ·
            任务 ${DB.tasks.length} 条 · 公告 ${DB.notices.length} 条 · 申请 ${DB.applications.length} 条
          </p>
        </div>
      </section>
    </div>`;

  /* 修改密码 */
  $('#changePwBtn', el).onclick = () => {
    const oldPw  = $('#pw_old', el).value.trim();
    const newPw  = $('#pw_new', el).value.trim();
    const newPw2 = $('#pw_new2', el).value.trim();

    if(!oldPw || !newPw || !newPw2){ toast('请完整填写密码信息', 'error'); return; }
    if(currentUser.password !== oldPw){ toast('原密码错误', 'error'); return; }
    if(newPw.length < 6){ toast('新密码长度不能少于 6 位', 'error'); return; }
    if(newPw !== newPw2){ toast('两次输入的新密码不一致', 'error'); return; }

    currentUser.password = newPw;
    saveAll();
    addLog(currentUser.id, '修改密码');
    toast('密码修改成功');
    $('#pw_old', el).value = $('#pw_new', el).value = $('#pw_new2', el).value = '';
  };

  /* 清空人员与业务数据（保留组织架构 + 当前管理员） */
  $('#clearBtn', el).onclick = () => {
    const staffCount = DB.users.filter(u => u.role === 'staff').length;
    confirmModal(
      '确定清空所有部门人员与业务数据吗？将删除：部门人员账号 ' + staffCount + ' 个、任务 ' +
      DB.tasks.length + ' 条、公告 ' + DB.notices.length + ' 条、申请 ' + DB.applications.length +
      ' 条、全部操作日志。组织架构与当前管理员账号会保留，此操作不可撤销。',
      () => {
        DB.users        = [currentUser];
        DB.tasks        = [];
        DB.notices      = [];
        DB.applications = [];
        DB.logs         = [];
        saveAll();
        Store.set(K.read, {});
        toast('已清空人员与业务数据，仅保留当前管理员');
        refresh();
      }, '确认清空');
  };

  /* 恢复完整演示数据（按招新岗位表，含演示人员与业务数据） */
  $('#resetBtn', el).onclick = () => {
    confirmModal('确定恢复完整演示数据吗？当前所有数据将被覆盖！', () => {
      const id = currentUser.id;
      seedDemoData();
      loadAll();
      currentUser = getUser(id) || getUser('u1');
      if(currentUser) Store.set(K.cur, { id: currentUser.id });
      toast('完整演示数据已恢复');
      refresh();
    }, '确认恢复');
  };

  /* 通知与推送设置 */
  $('#askNotifBtn', el).onclick = askDesktopNotify;
  $('#testScBtn', el).onclick = () => {
    DB.pushCfg = DB.pushCfg || {};
    DB.pushCfg.serverchanKey = $('#cfg_scKey', el).value.trim();
    saveAll();
    testPush('serverchan');
  };
  $('#testNtfyBtn', el).onclick = () => {
    DB.pushCfg = DB.pushCfg || {};
    DB.pushCfg.ntfyTopic = $('#cfg_ntfy', el).value.trim();
    saveAll();
    testPush('ntfy');
  };
  ['cfg_scKey', 'cfg_ntfy'].forEach(cid => {
    $('#' + cid, el).addEventListener('change', () => {
      DB.pushCfg = DB.pushCfg || {};
      DB.pushCfg.serverchanKey = $('#cfg_scKey', el).value.trim();
      DB.pushCfg.ntfyTopic     = $('#cfg_ntfy', el).value.trim();
      saveAll();
      const tipEl = $('#pushSaveTip', el);
      if(tipEl){ tipEl.textContent = '✅ 推送配置已保存'; tipEl.style.color = '#16a34a'; }
    });
  });

  /* 展示当前存储模式 */
  const modeTxt = $('#storeModeTxt', el);
  if (modeTxt){
    modeTxt.textContent = storageMode === 'memory'
      ? '⚠️ 内存模式（localStorage 不可用，数据仅在本次会话保留）'
      : '✅ 本地存储（数据将保存在浏览器中）';
    modeTxt.style.color = storageMode === 'memory' ? '#dc2626' : '#16a34a';
  }

  /* 导出 */
  $('#exportBtn', el).onclick = () => {
    const data = {
      organizations: DB.organizations,
      departments : DB.departments,
      users       : DB.users,
      tasks       : DB.tasks,
      notices     : DB.notices,
      applications: DB.applications,
      logs        : DB.logs,
      read        : loadKey(K.read, {}),
      _meta: { version: 2, exportedAt: new Date().toISOString(), storageMode: storageMode }
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'school-collab-data-' + Date.now() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    toast('数据已导出（已包含已读状态等元数据）');
  };

  /* 导入 */
  const fileInput = $('#importFile', el);
  $('#importBtn', el).onclick = () => fileInput.click();
  fileInput.onchange = () => {
    const file = fileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        const data = JSON.parse(ev.target.result);
        if(!data || typeof data !== 'object') throw new Error('数据格式不正确');
        Store.set(K.orgs,    data.organizations || []);
        Store.set(K.dept,    data.departments  || []);
        Store.set(K.users,   data.users        || []);
        Store.set(K.tasks,   data.tasks        || []);
        Store.set(K.notices, data.notices      || []);
        Store.set(K.apps,    data.applications || []);
        Store.set(K.logs,    data.logs         || []);
        if (data.read) Store.set(K.read, data.read);
        loadAll();
        /* 重新挂载会话 */
        const u = getUser(currentUser.id);
        if(u && u.status === 1){ currentUser = u; }
        else { currentUser = null; Store.remove(K.cur); }
        toast('数据导入成功');
        refresh();
      }catch(err){
        toast('导入失败：' + (err.message || err), 'error');
      }
      fileInput.value = '';
    };
    reader.readAsText(file);
  };
}

/* ============================================================
 * 4.10 部门人员 —— 我的部门（按职级开放不同功能）
 *   正职 chief ：部门管理 —— 成员管理 + 发布任务 + 任务进度 + 催办
 *   副职 deputy：部门概况 —— 成员名单 + 任务进度（只读）
 *   干事 member：部门信息 —— 部门基本资料 + 成员名单
 * ============================================================ */
function pageMyDept(el){
  const u = currentUser;
  const d = myDept();

  if(!d){
    el.innerHTML = `
      <section class="card">
        <div class="card-head"><h3>部门信息</h3></div>
        <div class="card-body"><p class="muted">您暂未分配部门，请联系管理员。</p></div>
      </section>`;
    return;
  }

  const members  = deptMembers(d.id);
  const tasks    = deptTasks(d.id);
  const isChief  = u.rank === 'chief';
  const showProg = canViewDeptProgress(u);

  const todoCnt   = tasks.filter(t => t.status === 'pending' || t.status === 'doing').length;
  const doneCnt   = tasks.filter(t => t.status === 'done').length;
  const reviewCnt = tasks.filter(t => t.status === 'reviewed').length;
  const rate      = tasks.length ? Math.round(tasks.filter(t => t.status === 'done' || t.status === 'reviewed').length / tasks.length * 100) : 0;

  el.innerHTML = `
    <div class="stat-grid">
      ${statCard('👥', '部门成员', members.length, '#2563eb')}
      ${statCard('📋', '部门任务', tasks.length, '#f59e0b')}
      ${statCard('⏳', '进行中 / 待办', todoCnt, '#dc2626')}
      ${statCard('✅', '完成率', rate + '%', '#16a34a')}
    </div>

    <section class="card">
      <div class="card-head">
        <h3>${isChief ? '本部门信息（负责人视图）' : '本部门信息'}</h3>
        ${isChief ? '<button class="btn btn-primary" id="chiefAddTaskBtn">＋ 发布任务给本部门</button>' : ''}
      </div>
      <div class="card-body">
        <div class="detail">
          <p><b>所属机构：</b>${esc(orgName(d.orgId))}</p>
          <p><b>部门名称：</b>${esc(d.name)}</p>
          <p><b>我的岗位：</b>${esc(u.title || rankLabel(u.rank))} ${rankBadge(u.rank)}</p>
          <p><b>部门负责人：</b>${esc(d.leader || '—')}</p>
          <p><b>联系电话：</b>${esc(d.phone || '—')}</p>
          <p><b>部门描述：</b>${esc(d.desc || '—')}</p>
        </div>
        ${!isChief && u.rank === 'member'
          ? '<p class="muted" style="margin-top:12px;font-size:12.5px;">💡 干事/队员可查看本部门任务并更新自己的任务进度；任务发布与部门管理由正职负责。</p>'
          : ''}
        ${u.rank === 'deputy'
          ? '<p class="muted" style="margin-top:12px;font-size:12.5px;">💡 副职可查看本部门成员与任务进度；如需调整任务请联系本部门正职或管理员。</p>'
          : ''}
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h3>部门成员（共 ${members.length} 人）</h3></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>姓名</th><th>账号</th><th>岗位</th><th>职级</th><th>电话</th><th>状态</th></tr></thead>
          <tbody>
            ${ members.length ? members.map(m => `
              <tr>
                <td><strong>${esc(m.name)}</strong></td>
                <td>${esc(m.username)}</td>
                <td>${esc(m.title || rankLabel(m.rank))}</td>
                <td>${rankBadge(m.rank)}</td>
                <td>${esc(m.phone || '—')}</td>
                <td>${m.status === 1 ? '<span class="badge badge-green">启用</span>' : '<span class="badge badge-red">禁用</span>'}</td>
              </tr>`).join('') : '<tr><td colspan="6" class="muted">暂无成员</td></tr>' }
          </tbody>
        </table>
      </div>
    </section>

    ${ showProg ? `
    <section class="card">
      <div class="card-head">
        <h3>部门任务进度${isChief ? '（正职可催办）' : '（只读）'}</h3>
        <span class="muted" style="font-size:12.5px;">已完成 ${doneCnt} · 待审核 ${reviewCnt} · 进行中/待办 ${todoCnt}</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>任务标题</th><th>承接人 / 对象</th><th>优先级</th><th>截止时间</th><th>状态</th><th>完成说明</th>${isChief ? '<th>操作</th>' : ''}</tr>
          </thead>
          <tbody>
            ${ tasks.length ? [...tasks].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).map(t => `
              <tr>
                <td><strong>${esc(t.title)}</strong></td>
                <td>${esc(targetText(t))}</td>
                <td>${priorityBadge(t.priority)}</td>
                <td class="${isOverdue(t) ? 'overdue' : ''}">${fmt(t.deadline)}</td>
                <td>${statusBadge(t.status)}</td>
                <td class="muted" style="white-space:normal;max-width:220px;">${esc(t.submitContent || '—')}</td>
                ${isChief ? `<td><div class="ops">
                  <button class="btn btn-sm btn-primary" data-view="${t.id}">查看</button>
                  ${t.status === 'done' ? `<button class="btn btn-sm btn-success" data-review="${t.id}">审核</button>` : ''}
                  ${(t.status === 'pending' || t.status === 'doing')
                    ? `<button class="btn btn-sm btn-warn" data-urge="${t.id}">催办</button>` : ''}
                </div></td>` : ''}
              </tr>`).join('') : `<tr><td colspan="${isChief ? 7 : 6}" class="muted">本部门暂无任务</td></tr>` }
          </tbody>
        </table>
      </div>
    </section>` : '' }`;

  /* 正职：发布任务给本部门成员 */
  if(isChief && $('#chiefAddTaskBtn', el)){
    $('#chiefAddTaskBtn', el).onclick = () => openChiefTaskModal(d, members);
  }

  /* 正职：查看 / 审核 / 催办 */
  if(isChief){
    el.querySelectorAll('[data-view]').forEach(b => b.onclick = () => viewTask(b.dataset.view));
    el.querySelectorAll('[data-review]').forEach(b => b.onclick = () => viewTask(b.dataset.review));
    el.querySelectorAll('[data-urge]').forEach(b => b.onclick = () => urgeTask(b.dataset.urge));
  }
}

/** 正职发布任务（对象限定为本部门成员） */
function openChiefTaskModal(d, members){
  const targets = members.filter(m => m.id !== currentUser.id);
  if(!targets.length){
    toast('本部门暂无可派发任务的其他成员', 'warn');
    return;
  }
  openModal('发布任务给本部门', `
    <div class="field"><label>任务标题 <i>*</i></label>
      <input id="ct_title" placeholder="请输入任务标题"></div>
    <div class="field"><label>任务内容</label>
      <textarea id="ct_content" rows="3" placeholder="请输入任务详细内容"></textarea></div>
    <div class="field"><label>派发给 <i>*</i></label>
      <select id="ct_target">
        ${targets.map(m => `<option value="${m.id}">${esc(m.name)}（${esc(m.title || rankLabel(m.rank))}）</option>`).join('')}
      </select></div>
    <div class="field"><label>优先级</label>
      <select id="ct_priority">
        <option value="高">高</option>
        <option value="中" selected>中</option>
        <option value="低">低</option>
      </select></div>
    <div class="field"><label>截止时间 <i>*</i></label>
      <input type="datetime-local" id="ct_deadline" value="${futureDate(3, 18)}"></div>
    <p class="muted" style="font-size:12.5px;">任务将由「${esc(currentUser.name)}」发布，成员完成后需经审核。</p>
  `, () => {
    const title    = modalEl.querySelector('#ct_title').value.trim();
    const content  = modalEl.querySelector('#ct_content').value.trim();
    const targetId = modalEl.querySelector('#ct_target').value;
    const priority = modalEl.querySelector('#ct_priority').value;
    const deadline = modalEl.querySelector('#ct_deadline').value;

    if(!title){ toast('请填写任务标题', 'error'); return false; }
    if(!targetId){ toast('请选择派发对象', 'error'); return false; }
    if(!deadline){ toast('请选择截止时间', 'error'); return false; }

    DB.tasks.push({
      id: uid('t'), title, content, targetType:'user', targetId, priority, deadline,
      status:'pending', creatorId: currentUser.id, createdAt: nowISO(),
      submitContent:'', reviewRemark:''
    });
    saveAll();
    addLog(currentUser.id, '（正职）发布任务：' + title + ' → ' + userName(targetId));
    toast('任务已发布给 ' + userName(targetId));
    refresh();
  }, '发布任务');
}

/** 正职催办 */
function urgeTask(id){
  const t = DB.tasks.find(x => x.id === id);
  if(!t) return;
  confirmModal(`确定向「${targetText(t)}」发送催办提醒吗？`, () => {
    addLog(currentUser.id, '催办任务：' + t.title);
    toast('已发送催办提醒给 ' + targetText(t));
